# H5 deliberation harness v2 — smoke config: state-ADAPTIVE depth.
# Stopping rule: DEPTH_DEF §6 verbatim (§12 amendment): stop iff rounds >= k
# (k = adaptive_min_rounds = 3) and all of the last k per-round absolute
# confidence gains are < epsilon; hard cap at adaptive_max_rounds.
# Frozen values: eps = 0.02, k = 3, cap = 16. See CONFIG_FORMAT.md.
mode=adaptive
shallow_rounds=2
deep_rounds=16
adaptive_min_rounds=3
adaptive_max_rounds=16
conf_threshold=800
stability_window=3
epsilon=20
elim_margin=900
refute_threshold=600
evidence_cap=64
