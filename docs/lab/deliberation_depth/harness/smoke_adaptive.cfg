# H5 deliberation harness — smoke config: state-ADAPTIVE depth.
# Stopping rule: stop when rounds>=min AND confidence>=threshold AND the
# leader held for stability_window rounds AND the margin gain over that
# window is < epsilon; hard cap at adaptive_max_rounds. See CONFIG_FORMAT.md.
mode=adaptive
shallow_rounds=2
deep_rounds=16
adaptive_min_rounds=2
adaptive_max_rounds=16
conf_threshold=800
stability_window=2
epsilon=50
elim_margin=900
refute_threshold=600
evidence_cap=64
