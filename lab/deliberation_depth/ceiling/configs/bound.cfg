# H5B sweep config: bound (residual-flip bound stopping rule; cap 64).
# Active keys in bound mode: adaptive_max_rounds (hard cap, recorded cap=1),
# elim_margin, refute_threshold, evidence_cap. All other keys required for
# format stability but ignored (see harness/CONFIG_FORMAT.md).
mode=bound
shallow_rounds=2
deep_rounds=64
adaptive_min_rounds=3
adaptive_max_rounds=64
conf_threshold=800
stability_window=3
epsilon=20
elim_margin=900
refute_threshold=600
evidence_cap=64
