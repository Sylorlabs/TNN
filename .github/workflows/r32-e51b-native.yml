name: R32 E51B Native Sequential Discriminator

on:
  push:
    branches: [r32-agent-sequential-frontier]
    paths:
      - 'Research/R32_E51B_NATIVE/**'
      - 'Research/R32_E51B_BATCH_TERMINAL_SEQUENTIAL_CONTINUATION_PREREG.md'
      - '.github/workflows/r32-e51b-native.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble native candidate deterministically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51b
          cat Research/R32_E51B_NATIVE/01_core_and_seed.zagfrag \
              Research/R32_E51B_NATIVE/02_targets_and_metrics.zagfrag \
              Research/R32_E51B_NATIVE/03_validation_and_fit_setup.zagfrag \
              Research/R32_E51B_NATIVE/04_fit_validation_gates.zagfrag \
              > .scratch/e51b/E51B_FRAGMENT.zag
          python3 - <<'PY'
          from pathlib import Path
          src_path = Path('Research/tnn_r32_e50_provenance_temporal_contention_discriminator.zag')
          src = src_path.read_text()
          frag = Path('.scratch/e51b/E51B_FRAGMENT.zag').read_text()
          main_marker = 'fn main()i32 {'
          assert src.count(main_marker) == 1, src.count(main_marker)
          src = src.replace(main_marker, frag + '\n\n' + main_marker, 1)
          anchor = 'let aux_frozen_gate:i32=0; if(aux_frozen_hash==frozen_aux_hash){ aux_frozen_gate=1; } e45_print_pair("e50_aux_frozen_gate",aux_frozen_gate);'
          assert src.count(anchor) == 1, src.count(anchor)
          injection = anchor + r'''

    let e51b_parent_integrity_gate:i32=0;
    if(seed_preflight_gate==1 && aux_clone_gate==1 && canonical_sample_count==E50_TERMINAL_SAMPLES && batch_bound_gate==1 && unknown_target_nonzero==0 && train_lattice_gate==1 && train_rep_gate==1 && batch_statistics_gate==1 && batch_identity_gate==1 && batch_converge_gate==1 && aux_frozen_gate==1){
        e51b_parent_integrity_gate=1;
    }
    e45_print_pair("e51b_parent_e50_integrity_gate",e51b_parent_integrity_gate);
    let e51b_gate:i32=0;
    if(e51b_parent_integrity_gate==1){
        e51b_gate=e51b_run(
            raw_seen,evidence_seen,resource_seen,
            frozen_source,frozen_dependence,frozen_consequence,frozen_hazard,
            frozen_shadow,frozen_shadow_bias,terminal_weights,terminal_biases
        );
    }else{
        _zag_println("e51b_outcome,PARENT_E50_INTEGRITY_FAILED");
        _zag_println("TNN_R32_E51B_BATCH_TERMINAL_SEQUENTIAL_CONTINUATION_GATE=FAIL");
    }
    if(e51b_gate==1){ return 0; }
    return 1;
'''
          src = src.replace(anchor, injection, 1)
          out = Path('.scratch/e51b/tnn_r32_e51b_batch_terminal_sequential_continuation.zag')
          out.write_text(src)
          PY
          sha256sum .scratch/e51b/E51B_FRAGMENT.zag \
                    .scratch/e51b/tnn_r32_e51b_batch_terminal_sequential_continuation.zag \
                    | tee .scratch/e51b/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler='Research/toolchain/znc_linux_x86_64_abed8aa1'
          src='.scratch/e51b/tnn_r32_e51b_batch_terminal_sequential_continuation.zag'
          chmod +x "$compiler"
          "$compiler" "$src" -o .scratch/e51b/NATIVE_BUILD_1 > .scratch/e51b/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$compiler" "$src" -o .scratch/e51b/NATIVE_BUILD_2 > .scratch/e51b/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51b/NATIVE_BUILD_1 .scratch/e51b/NATIVE_BUILD_2 | tee .scratch/e51b/BINARY_SHA256SUMS.txt
          cmp .scratch/e51b/NATIVE_BUILD_1 .scratch/e51b/NATIVE_BUILD_2
          echo 1 > .scratch/e51b/BYTE_IDENTICAL.txt

      - name: Execute E51B native validation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 5400 .scratch/e51b/NATIVE_BUILD_1 > .scratch/e51b/RAW.log 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > .scratch/e51b/EXIT_CODE.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|e51b_|TNN_R32_E51B_)' .scratch/e51b/RAW.log > .scratch/e51b/SUMMARY.log || true
          cat .scratch/e51b/SUMMARY.log
          echo "native_exit_code=$code"

      - name: Preserve complete E51B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51b-native-${{ github.sha }}
          path: |
            .scratch/e51b/
            Research/R32_E51B_BATCH_TERMINAL_SEQUENTIAL_CONTINUATION_PREREG.md
            Research/R32_E51B_NATIVE/
          compression-level: 6
          if-no-files-found: error
