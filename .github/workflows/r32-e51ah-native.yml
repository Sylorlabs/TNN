name: R32 E51AH Grounded Preservation Replay

on:
  workflow_dispatch:
  push:
    branches:
      - r32-agent-sequential-frontier
    paths:
      - 'Research/R32_E51AH_GROUNDED_PRESERVATION_REPLAY_PREREG.md'
      - 'Research/R32_E51AH_IMPLEMENTATION_CONTRACT.md'
      - 'Research/R32_E51AH_HARDCODING_LEDGER.json'
      - 'Research/R32_E51AH_NATIVE/**'
      - '.github/scripts/e51x_assemble.py'
      - '.github/scripts/e51y_assemble.py'
      - '.github/scripts/e51ad_assemble.py'
      - '.github/scripts/e51ah_assemble.py'
      - '.github/scripts/e51ah_verify.py'
      - '.github/scripts/e51ah_preflight.py'
      - '.github/scripts/e51ah_verify_test.py'
      - '.github/workflows/r32-e51ah-native.yml'
      - 'Research/toolchain/znc_linux_x86_64_abed8aa1'
      - 'Research/R32_E51AE_NATIVE/01a_contract_selection.zagfrag'
      - 'Research/R32_E51AE_NATIVE/01b_objective_fit.zagfrag'
      - 'Research/R32_E51AE_NATIVE/02a_run_direct.zagfrag'
      - 'Research/R32_E51AD_NATIVE/03_main_injection.zagfrag'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble frozen lineage plus E51AH replay treatment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51ah
          python3 -m json.tool Research/R32_E51AH_HARDCODING_LEDGER.json > /dev/null
          python3 -B .github/scripts/e51ah_verify_test.py
          python3 .github/scripts/e51x_assemble.py
          python3 .github/scripts/e51y_assemble.py
          python3 .github/scripts/e51ad_assemble.py
          python3 .github/scripts/e51ah_assemble.py
          test "$(cat .scratch/e51ah/SOURCE_PIN_GATE.txt)" = "1"
          git rev-parse HEAD > .scratch/e51ah/SOURCE_COMMIT.txt
          printf '%s\n' "$GITHUB_RUN_ID" > .scratch/e51ah/WORKFLOW_RUN_ID.txt
          sha256sum Research/toolchain/znc_linux_x86_64_abed8aa1 > .scratch/e51ah/COMPILER_SHA256SUMS.txt
          printf '%s  %s\n' '498abcb5ab346f8cb246222a1ca63699d035a4277dedfba4782e1373137e58ef' 'Research/toolchain/znc_linux_x86_64_abed8aa1' | sha256sum --check
          sha256sum \
            Research/R32_E51AH_GROUNDED_PRESERVATION_REPLAY_PREREG.md \
            Research/R32_E51AH_IMPLEMENTATION_CONTRACT.md \
            Research/R32_E51AH_HARDCODING_LEDGER.json \
            Research/R32_E51AH_NATIVE/01d_preservation_replay.zagfrag \
            Research/R32_E51AH_NATIVE/02b_run_preservation_replay.zagfrag \
            Research/R32_E51AH_NATIVE/03_main_injection.zagfrag \
            Research/R32_E51AE_NATIVE/01a_contract_selection.zagfrag \
            Research/R32_E51AE_NATIVE/01b_objective_fit.zagfrag \
            Research/R32_E51AE_NATIVE/02a_run_direct.zagfrag \
            Research/R32_E51AD_NATIVE/03_main_injection.zagfrag \
            .github/scripts/e51x_assemble.py \
            .github/scripts/e51y_assemble.py \
            .github/scripts/e51ad_assemble.py \
            .github/scripts/e51ah_assemble.py \
            .github/scripts/e51ah_verify.py \
            .github/scripts/e51ah_preflight.py \
            .github/scripts/e51ah_verify_test.py \
            .github/workflows/r32-e51ah-native.yml \
            Research/toolchain/znc_linux_x86_64_abed8aa1 \
            .scratch/e51ah/E51AH_FRAGMENT.zag \
            .scratch/e51ah/tnn_r32_e51ah_grounded_preservation_replay.zag \
            .scratch/e51ah/tnn_r32_e45_investigation_core.zag \
            | tee .scratch/e51ah/SOURCE_SHA256SUMS.txt
          sha256sum \
            Research/R32_NATIVE_AUTHORITY_CURRENT.json \
            Research/R32_NATIVE_AUTHORITY_DETAIL.json \
            Research/R32_E51_BASELINE_V1.json \
            Research/R32_E51_MASTER_LEDGER.json \
            Research/R32_E51_CAUSAL_MAP.md \
            Research/R32_E51_GENERALITY_SCORECARD.md \
            Research/R32_E51_MASTER_PLAN_PROVENANCE.json \
            Research/toolchain/R32_ZNC_PROVENANCE_2026-08-23.json \
            | tee .scratch/e51ah/AUTHORITY_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler=Research/toolchain/znc_linux_x86_64_abed8aa1
          source=.scratch/e51ah/tnn_r32_e51ah_grounded_preservation_replay.zag
          chmod +x "$compiler"
          {
            echo "github_sha=$GITHUB_SHA"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            uname -a
            python3 --version
            file "$compiler"
            sha256sum "$compiler"
          } | tee .scratch/e51ah/RUNTIME_ENVIRONMENT.txt
          "$compiler" "$source" --no-zagd --no-analyze --no-foreground-cache -o .scratch/e51ah/NATIVE_BUILD_1 > .scratch/e51ah/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$compiler" "$source" --no-zagd --no-analyze --no-foreground-cache -o .scratch/e51ah/NATIVE_BUILD_2 > .scratch/e51ah/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51ah/NATIVE_BUILD_1 .scratch/e51ah/NATIVE_BUILD_2 | tee .scratch/e51ah/BINARY_SHA256SUMS.txt
          cmp .scratch/e51ah/NATIVE_BUILD_1 .scratch/e51ah/NATIVE_BUILD_2
          echo 1 > .scratch/e51ah/BYTE_IDENTICAL.txt

      - name: Native synthetic preflight without experimental data
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/e51ah_preflight.py
          Research/toolchain/znc_linux_x86_64_abed8aa1 .scratch/e51ah/preflight/NATIVE_SELFTEST.zag --no-zagd --no-analyze --no-foreground-cache -o .scratch/e51ah/preflight/NATIVE_SELFTEST > .scratch/e51ah/preflight/COMPILE.log 2>&1
          timeout 30 .scratch/e51ah/preflight/NATIVE_SELFTEST | tee .scratch/e51ah/preflight/RESULT.log
          grep -qx 'E51AH_SYNTHETIC_SELFTESTS_PASS=1' .scratch/e51ah/preflight/RESULT.log

      - name: Execute E51AH native causal discriminator
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 17000 .scratch/e51ah/NATIVE_BUILD_1 > .scratch/e51ah/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          echo "$code" > .scratch/e51ah/EXIT_CODE.txt
          echo "$((end-start))" > .scratch/e51ah/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|e51y_parent_e50_integrity_gate|e51y_terminal_reproduction|R32_E51AH_NATIVE|experiment_schema,tnn_r32_e51ah|claim_boundary,grounded|native_zag|mature_slot|frozen_direct|residual_features|candidate_action_interface|deployment_policy|evaluator_|ambiguity_|mode_resource|unknown_|topology_|graph_|e51ah_|TNN_R32_E51AH_)' .scratch/e51ah/RAW.log > .scratch/e51ah/SUMMARY.log || true
          cat .scratch/e51ah/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0
          test "$(grep -c '^TNN_R32_E51AH_EXECUTION_COMPLETE=1$' .scratch/e51ah/RAW.log)" -eq 1
          test "$(grep -c '^e51ah_integrity_gate,1$' .scratch/e51ah/RAW.log)" -eq 1
          python3 .github/scripts/e51ah_verify.py .scratch/e51ah

      - name: Preserve complete E51AH evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51ah-native-${{ github.sha }}
          path: |
            .scratch/e51ah/
            Research/R32_E51AH_GROUNDED_PRESERVATION_REPLAY_PREREG.md
            Research/R32_E51AH_IMPLEMENTATION_CONTRACT.md
            Research/R32_E51AH_HARDCODING_LEDGER.json
            Research/R32_E51AH_NATIVE/01d_preservation_replay.zagfrag
            Research/R32_E51AH_NATIVE/02b_run_preservation_replay.zagfrag
            Research/R32_E51AH_NATIVE/03_main_injection.zagfrag
            Research/R32_E51AG_RESULT.md
            Research/R32_E51_PROGRAM_CHARTER.md
            Research/R32_E51_EXECUTION_JOURNAL.md
            Research/R32_NATIVE_AUTHORITY_CURRENT.json
            Research/R32_NATIVE_AUTHORITY_DETAIL.json
            Research/R32_E51_BASELINE_V1.json
            Research/R32_E51_MASTER_LEDGER.json
            Research/R32_E51_CAUSAL_MAP.md
            Research/R32_E51_GENERALITY_SCORECARD.md
            Research/R32_E51_MASTER_PLAN_PROVENANCE.json
            Research/toolchain/R32_ZNC_PROVENANCE_2026-08-23.json
            .github/scripts/e51x_assemble.py
            .github/scripts/e51y_assemble.py
            .github/scripts/e51ad_assemble.py
            .github/scripts/e51ah_assemble.py
            .github/scripts/e51ah_verify.py
            .github/scripts/e51ah_preflight.py
            .github/scripts/e51ah_verify_test.py
            .github/workflows/r32-e51ah-native.yml
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: error
