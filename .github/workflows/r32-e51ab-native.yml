name: R32 E51AB Direct Candidate Commit Actions

on:
  push:
    branches:
      - r32-agent-sequential-frontier
    paths:
      - 'Research/R32_E51AB_DIRECT_CANDIDATE_COMMIT_PREREG.md'
      - 'Research/R32_E51AB_NATIVE/**'
      - '.github/scripts/e51ab_assemble.py'
      - '.github/workflows/r32-e51ab-native.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble frozen E51X terminal lineage plus direct candidate actions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51ab
          python3 .github/scripts/e51x_assemble.py
          python3 .github/scripts/e51y_assemble.py
          python3 .github/scripts/e51ab_assemble.py
          sha256sum \
            Research/R32_E51AB_DIRECT_CANDIDATE_COMMIT_PREREG.md \
            Research/R32_E51AB_NATIVE/01_direct_candidate_actions.zagfrag \
            Research/R32_E51AB_NATIVE/02_run_and_gates.zagfrag \
            Research/R32_E51AB_NATIVE/03_main_injection.zagfrag \
            .github/scripts/e51ab_assemble.py \
            .scratch/e51ab/E51AB_FRAGMENT.zag \
            .scratch/e51ab/tnn_r32_e51ab_direct_candidate_actions.zag \
            .scratch/e51ab/tnn_r32_e45_investigation_core.zag \
            | tee .scratch/e51ab/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          c=Research/toolchain/znc_linux_x86_64_abed8aa1
          s=.scratch/e51ab/tnn_r32_e51ab_direct_candidate_actions.zag
          chmod +x "$c"
          "$c" "$s" -o .scratch/e51ab/NATIVE_BUILD_1 > .scratch/e51ab/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$c" "$s" -o .scratch/e51ab/NATIVE_BUILD_2 > .scratch/e51ab/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51ab/NATIVE_BUILD_1 .scratch/e51ab/NATIVE_BUILD_2 | tee .scratch/e51ab/BINARY_SHA256SUMS.txt
          cmp .scratch/e51ab/NATIVE_BUILD_1 .scratch/e51ab/NATIVE_BUILD_2
          echo 1 > .scratch/e51ab/BYTE_IDENTICAL.txt

      - name: Execute E51AB native discriminator
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 16000 .scratch/e51ab/NATIVE_BUILD_1 > .scratch/e51ab/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          echo "$code" > .scratch/e51ab/EXIT_CODE.txt
          echo "$((end-start))" > .scratch/e51ab/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|e51y_parent_e50_integrity_gate|e51y_terminal_reproduction|R32_E51AB_NATIVE|experiment_schema,tnn_r32_e51ab|claim_boundary,native_action|native_zag|candidate_interface|belief_state|evaluator_|ambiguity_|unknown_|topology_|graph_|e51ab_|TNN_R32_E51AB_)' .scratch/e51ab/RAW.log > .scratch/e51ab/SUMMARY.log || true
          cat .scratch/e51ab/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51AB evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51ab-native-${{ github.sha }}
          path: |
            .scratch/e51ab/
            Research/R32_E51AB_DIRECT_CANDIDATE_COMMIT_PREREG.md
            Research/R32_E51AB_NATIVE/
            Research/R32_E51AA_RESULT.md
            Research/R32_E51Z_RESULT.md
            Research/R32_E51Y_RESULT.md
            Research/R32_E51X_RESULT.md
            .github/scripts/e51x_assemble.py
            .github/scripts/e51y_assemble.py
            .github/scripts/e51ab_assemble.py
          compression-level: 6
          if-no-files-found: error
