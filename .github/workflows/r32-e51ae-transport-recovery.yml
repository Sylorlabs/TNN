name: R32 E51AE Transport Recovery

on:
  push:
    branches:
      - r32-agent-sequential-frontier
    paths:
      - 'Research/R32_E51AE_NATIVE/transport/**'
      - 'Research/R32_E51AE_NATIVE/TRANSPORT_NOTE.md'
      - '.github/scripts/e51ae_transport_recover.py'
      - '.github/workflows/r32-e51ae-transport-recovery.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Recover and verify preregistered E51AE fragment
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/e51ae_transport_recover.py | tee .scratch/e51ae_recovery/RECOVERY.log
          sha256sum .scratch/e51ae_recovery/E51AE_FRAGMENT.zag | tee .scratch/e51ae_recovery/SHA256SUMS.txt
          test "$(sha256sum .scratch/e51ae_recovery/E51AE_FRAGMENT.zag | awk '{print $1}')" = "311b85839c81b8921b365012b467d4a3d36fd4a06c60d2e815067022d3049a5d"
          echo '--- first 80 lines ---'
          sed -n '1,80p' .scratch/e51ae_recovery/E51AE_FRAGMENT.zag
          echo '--- last 120 lines ---'
          tail -120 .scratch/e51ae_recovery/E51AE_FRAGMENT.zag

      - name: Preserve recovered source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51ae-source-recovery-${{ github.sha }}
          path: |
            .scratch/e51ae_recovery/
            Research/R32_E51AE_NATIVE/transport/
            Research/R32_E51AE_NATIVE/TRANSPORT_NOTE.md
            .github/scripts/e51ae_transport_recover.py
          compression-level: 6
          if-no-files-found: error
