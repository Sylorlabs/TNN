name: R32 E51AI Longitudinal Context Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [r32-agent-sequential-frontier]
    paths:
      - 'Research/R32_E51AI_LONGITUDINAL_CONTEXT_PREREG.md'
      - 'Research/R32_E51AI_HARDCODING_LEDGER.json'
      - 'Research/R32_E51AI_NATIVE/**'
      - '.github/scripts/e51ai_*.py'
      - '.github/workflows/r32-e51ai-native.yml'
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout frozen project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and identify native diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/scripts/e51ai_verify_test.py
          python3 -B .github/scripts/e51ai_assemble.py
          git rev-parse HEAD > .scratch/e51ai/SOURCE_COMMIT.txt
          printf '%s\n' "$GITHUB_RUN_ID" > .scratch/e51ai/WORKFLOW_RUN_ID.txt
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > .scratch/e51ai/RUN_ATTEMPT.txt
          sha256sum Research/toolchain/znc_linux_x86_64_abed8aa1 > .scratch/e51ai/COMPILER_SHA256SUMS.txt
          printf '%s  %s\n' '498abcb5ab346f8cb246222a1ca63699d035a4277dedfba4782e1373137e58ef' 'Research/toolchain/znc_linux_x86_64_abed8aa1' | sha256sum --check
          { uname -a; python3 --version; } > .scratch/e51ai/RUNTIME_ENVIRONMENT.txt
      - name: Compile twice with official native compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler=Research/toolchain/znc_linux_x86_64_abed8aa1
          chmod +x "$compiler"
          "$compiler" .scratch/e51ai/SOURCE.zag --no-zagd --no-analyze --no-foreground-cache -o .scratch/e51ai/NATIVE_BUILD_1 > .scratch/e51ai/BUILD_1.log 2>&1
          "$compiler" .scratch/e51ai/SOURCE.zag --no-zagd --no-analyze --no-foreground-cache -o .scratch/e51ai/NATIVE_BUILD_2 > .scratch/e51ai/BUILD_2.log 2>&1
          cmp .scratch/e51ai/NATIVE_BUILD_1 .scratch/e51ai/NATIVE_BUILD_2
          sha256sum .scratch/e51ai/NATIVE_BUILD_1 .scratch/e51ai/NATIVE_BUILD_2 > .scratch/e51ai/BINARY_SHA256SUMS.txt
          echo 1 > .scratch/e51ai/BYTE_IDENTICAL.txt
      - name: Synthetic native tests without experimental exposure
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/scripts/e51ai_preflight.py
          Research/toolchain/znc_linux_x86_64_abed8aa1 .scratch/e51ai/preflight/SELFTEST.zag --no-zagd --no-analyze --no-foreground-cache -o .scratch/e51ai/preflight/SELFTEST > .scratch/e51ai/preflight/BUILD.log 2>&1
          timeout 30 .scratch/e51ai/preflight/SELFTEST | tee .scratch/e51ai/preflight/RESULT.log
          grep -qx 'E51AI_SYNTHETIC_SELFTESTS_PASS=1' .scratch/e51ai/preflight/RESULT.log
      - name: Execute frozen 32-block longitudinal diagnostic
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 3600 .scratch/e51ai/NATIVE_BUILD_1 > .scratch/e51ai/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          echo "$code" > .scratch/e51ai/EXIT_CODE.txt
          echo "$((end-start))" > .scratch/e51ai/RUNTIME_SECONDS.txt
          grep -E '^(e51ai_(dataset|metrics|continuity|.*gate|blocks_completed|outcome)|TNN_R32_E51AI_)' .scratch/e51ai/RAW.log > .scratch/e51ai/SUMMARY.log || true
          test "$code" -eq 0
          python3 -B .github/scripts/e51ai_verify.py .scratch/e51ai
      - name: Preserve complete or partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51ai-native-${{ github.sha }}
          path: .scratch/e51ai/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
