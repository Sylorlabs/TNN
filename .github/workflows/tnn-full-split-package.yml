name: TNN Complete Split ZIP

on:
  push:
    branches: [r32-agent-sequential-frontier]
    paths:
      - 'Research/R32_AGENT_FINAL_PACKAGE_REQUEST.txt'
      - '.github/workflows/tnn-full-split-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout complete project snapshot
        uses: actions/checkout@v4

      - name: Build standard complete ZIP and connector-safe pieces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          archive="package/TNN-entire-project-${GITHUB_SHA}.zip"
          zip -q -9 -r "$archive" . -x '.git/*' 'package/*'
          sha256sum "$archive" > "${archive}.sha256"
          stat -c '%s' "$archive" > package/ZIP_SIZE_BYTES.txt
          split -b 200M -d -a 2 "$archive" "package/TNN-entire-project-${GITHUB_SHA}.zip.part-"
          sha256sum package/TNN-entire-project-${GITHUB_SHA}.zip.part-* > package/PART_SHA256SUMS.txt
          cat > package/REASSEMBLE.txt <<EOF
          cat TNN-entire-project-${GITHUB_SHA}.zip.part-* > TNN-entire-project-${GITHUB_SHA}.zip
          sha256sum -c TNN-entire-project-${GITHUB_SHA}.zip.sha256
          EOF
          rm "$archive"
          ls -lh package/

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: tnn-entire-project-part-00-${{ github.sha }}
          path: package/*part-00
          compression-level: 0
          if-no-files-found: error

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: tnn-entire-project-part-01-${{ github.sha }}
          path: package/*part-01
          compression-level: 0
          if-no-files-found: error

      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: tnn-entire-project-part-02-${{ github.sha }}
          path: package/*part-02
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: tnn-entire-project-part-03-${{ github.sha }}
          path: package/*part-03
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: tnn-entire-project-part-04-${{ github.sha }}
          path: package/*part-04
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: tnn-entire-project-manifest-${{ github.sha }}
          path: |
            package/*.sha256
            package/PART_SHA256SUMS.txt
            package/REASSEMBLE.txt
            package/ZIP_SIZE_BYTES.txt
          compression-level: 0
          if-no-files-found: error
