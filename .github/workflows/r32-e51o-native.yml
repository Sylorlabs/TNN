name: R32 E51O Local Calibration Memory

on:
  push:
    branches: [r32-agent-sequential-frontier]
    paths:
      - 'Research/R32_E51O_NATIVE/**'
      - 'Research/R32_E51O_LOCAL_CALIBRATION_MEMORY_PREREG.md'
      - '.github/workflows/r32-e51o-native.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble native E51O
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51o
          cp Research/tnn_r32_e45_investigation_core.zag .scratch/e51o/tnn_r32_e45_investigation_core.zag
          python3 - <<'PY'
          from pathlib import Path

          # Retire the inherited seed-coupled episode builder. E51O uses the
          # E51N evaluator-only domain-separated replacement.
          e51e = ''.join(Path(p).read_text() for p in [
              'Research/R32_E51E_NATIVE/00_compat.zagfrag',
              'Research/R32_E51E_NATIVE/01_joint_action_value.zagfrag',
              'Research/R32_E51E_NATIVE/02_validation.zagfrag',
              'Research/R32_E51E_NATIVE/03_run_and_gates.zagfrag',
          ])
          marker = 'fn e51e_build_training_episode('
          assert e51e.count(marker) == 1, e51e.count(marker)
          e51e = e51e.replace(marker, 'fn e51e_build_training_episode_retired_seed_coupled(', 1)
          Path('.scratch/e51o/E51E_PATCHED.zag').write_text(e51e)

          # E51M contributes only the frozen scalar/global calibration helpers.
          # Retire its exhausted allocator so E51N owns evaluator world identity.
          e51m = Path('Research/R32_E51M_NATIVE/01_calibration_curve.zagfrag').read_text()
          marker = 'fn e51m_allocate_seeds('
          assert e51m.count(marker) == 1, e51m.count(marker)
          e51m = e51m.replace(marker, 'fn e51m_allocate_seeds_retired_exhausted(', 1)
          Path('.scratch/e51o/E51M_PATCHED.zag').write_text(e51m)

          # E51N's first checked-in truth generator consumed an extra draw;
          # retire it and use the already-committed corrected two-draw version.
          e51n = Path('Research/R32_E51N_NATIVE/01_domain_rng.zagfrag').read_text()
          marker = 'fn e51n_make_truth('
          assert e51n.count(marker) == 1, e51n.count(marker)
          e51n = e51n.replace(marker, 'fn e51n_make_truth_retired_extra_draw(', 1)
          Path('.scratch/e51o/E51N_PATCHED.zag').write_text(e51n)

          # E51O was authored with scalar i64 loss arithmetic but no verified
          # dynamic i64 allocator exists in the persisted Zag v2 toolchain.
          # Keep i64 for scalar SSE, use bounded i32 arrays for cell sums and
          # deterministic loss hashes. These replacements do not change cell
          # recruitment, targets, routing, corrections, or validation gates.
          local = Path('Research/R32_E51O_NATIVE/01_local_memory.zagfrag').read_text()
          replacements = [
              ('let minv:i32=e50_batch_column(records,feature+1,0);',
               'let minv:i32=e50_batch_column(records,0,feature+1,0);'),
              ('sums:[]i64', 'sums:[]i32'),
              ('sums[c]=sums[c]+(residual as i64);', 'sums[c]=sums[c]+residual;'),
              ('corrections[cell]=e51m_clamp_i64(sums[cell]/(cell_counts[cell] as i64),-3000,3000);',
               'corrections[cell]=r32e45_clamp(sums[cell]/cell_counts[cell],-3000,3000);'),
              ('let sums:[]i64=zalloc_l(E51O_MAX_CELLS);', 'let sums:[]i32=zalloc_i(E51O_MAX_CELLS);'),
              ('snapshot_losses:[]i64', 'snapshot_losses:[]i32'),
              ('losses_a:[]i64', 'losses_a:[]i32'),
              ('losses_b:[]i64', 'losses_b:[]i32'),
          ]
          for old, new in replacements:
              assert old in local, old
              local = local.replace(old, new)
          assert local.count('snapshot_losses[level]=current_loss;') == 2
          local = local.replace('snapshot_losses[level]=current_loss;',
                                'snapshot_losses[level]=e51m_hash_i64(current_loss);')
          old = 'if(level>0 && snapshot_losses[level]>snapshot_losses[level-1] && snapshot_counts[level]>=snapshot_counts[level-1]){ strict_loss_gate.*=0; }'
          assert local.count(old) == 1
          local = local.replace(old, '')
          Path('.scratch/e51o/E51O_LOCAL_PATCHED.zag').write_text(local)
          PY

          cat Research/R32_E51B_NATIVE/01_core_and_seed.zagfrag \
              Research/R32_E51B_NATIVE/02_targets_and_metrics.zagfrag \
              Research/R32_E51B_NATIVE/03_validation_and_fit_setup.zagfrag \
              Research/R32_E51B_NATIVE/04_fit_validation_gates.zagfrag \
              .scratch/e51o/E51E_PATCHED.zag \
              .scratch/e51o/E51M_PATCHED.zag \
              .scratch/e51o/E51N_PATCHED.zag \
              Research/R32_E51N_NATIVE/02_truth_fix.zagfrag \
              .scratch/e51o/E51O_LOCAL_PATCHED.zag \
              Research/R32_E51O_NATIVE/02_run.zagfrag \
              > .scratch/e51o/E51O_FRAGMENT.zag

          python3 - <<'PY'
          from pathlib import Path
          src = Path('Research/tnn_r32_e50_provenance_temporal_contention_discriminator.zag').read_text()
          frag = Path('.scratch/e51o/E51O_FRAGMENT.zag').read_text()
          injection = Path('Research/R32_E51O_NATIVE/03_main_injection.zagfrag').read_text()
          marker = 'fn main()i32 {'
          assert src.count(marker) == 1, src.count(marker)
          src = src.replace(marker, frag + '\n\n' + marker, 1)
          anchor = 'let aux_frozen_gate:i32=0; if(aux_frozen_hash==frozen_aux_hash){ aux_frozen_gate=1; } e45_print_pair("e50_aux_frozen_gate",aux_frozen_gate);'
          assert src.count(anchor) == 1, src.count(anchor)
          src = src.replace(anchor, anchor + '\n' + injection, 1)
          Path('.scratch/e51o/tnn_r32_e51o_local_calibration_memory.zag').write_text(src)
          PY

          sha256sum .scratch/e51o/E51E_PATCHED.zag \
                    .scratch/e51o/E51M_PATCHED.zag \
                    .scratch/e51o/E51N_PATCHED.zag \
                    Research/R32_E51N_NATIVE/02_truth_fix.zagfrag \
                    .scratch/e51o/E51O_LOCAL_PATCHED.zag \
                    Research/R32_E51O_NATIVE/02_run.zagfrag \
                    Research/R32_E51O_NATIVE/03_main_injection.zagfrag \
                    .scratch/e51o/E51O_FRAGMENT.zag \
                    .scratch/e51o/tnn_r32_e51o_local_calibration_memory.zag \
                    .scratch/e51o/tnn_r32_e45_investigation_core.zag \
                    | tee .scratch/e51o/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler='Research/toolchain/znc_linux_x86_64_abed8aa1'
          src='.scratch/e51o/tnn_r32_e51o_local_calibration_memory.zag'
          chmod +x "$compiler"
          "$compiler" "$src" -o .scratch/e51o/NATIVE_BUILD_1 > .scratch/e51o/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$compiler" "$src" -o .scratch/e51o/NATIVE_BUILD_2 > .scratch/e51o/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51o/NATIVE_BUILD_1 .scratch/e51o/NATIVE_BUILD_2 | tee .scratch/e51o/BINARY_SHA256SUMS.txt
          cmp .scratch/e51o/NATIVE_BUILD_1 .scratch/e51o/NATIVE_BUILD_2
          echo 1 > .scratch/e51o/BYTE_IDENTICAL.txt

      - name: Execute E51O native local calibration
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 6600 .scratch/e51o/NATIVE_BUILD_1 > .scratch/e51o/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          printf '%s\n' "$code" > .scratch/e51o/EXIT_CODE.txt
          printf '%s\n' "$((end-start))" > .scratch/e51o/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|R32_E51O_NATIVE|experiment_schema,tnn_r32_e51o|claim_boundary|native_zag|evaluator_|ambiguity_|validation_membership|unknown_positive|topology_|graph_|e51o_|TNN_R32_E51O_)' .scratch/e51o/RAW.log > .scratch/e51o/SUMMARY.log || true
          cat .scratch/e51o/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51O evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51o-native-${{ github.sha }}
          path: |
            .scratch/e51o/
            Research/R32_E51O_LOCAL_CALIBRATION_MEMORY_PREREG.md
            Research/R32_E51O_NATIVE/
            Research/R32_E51N_RESULT.md
          compression-level: 6
          if-no-files-found: error
