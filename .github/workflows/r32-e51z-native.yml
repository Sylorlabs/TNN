name: R32 E51Z Stopping State Oracle Audit

on:
  push:
    branches:
      - r32-agent-sequential-frontier
    paths:
      - 'Research/R32_E51Z_STOPPING_STATE_ORACLE_AUDIT_PREREG.md'
      - 'Research/R32_E51Z_NATIVE/**'
      - '.github/scripts/e51z_assemble.py'
      - '.github/workflows/r32-e51z-native.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble frozen E51Y plus evaluator-only E51Z audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51z
          python3 .github/scripts/e51x_assemble.py
          python3 .github/scripts/e51y_assemble.py
          python3 .github/scripts/e51z_assemble.py
          sha256sum \
            Research/R32_E51Z_STOPPING_STATE_ORACLE_AUDIT_PREREG.md \
            Research/R32_E51Z_NATIVE/01_stopping_oracle_audit.zagfrag \
            Research/R32_E51Z_NATIVE/02_audit_injection.zagfrag \
            .github/scripts/e51z_assemble.py \
            .scratch/e51z/tnn_r32_e51z_stopping_oracle_audit.zag \
            .scratch/e51z/tnn_r32_e45_investigation_core.zag \
            | tee .scratch/e51z/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          c=Research/toolchain/znc_linux_x86_64_abed8aa1
          s=.scratch/e51z/tnn_r32_e51z_stopping_oracle_audit.zag
          chmod +x "$c"
          "$c" "$s" -o .scratch/e51z/NATIVE_BUILD_1 > .scratch/e51z/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$c" "$s" -o .scratch/e51z/NATIVE_BUILD_2 > .scratch/e51z/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51z/NATIVE_BUILD_1 .scratch/e51z/NATIVE_BUILD_2 | tee .scratch/e51z/BINARY_SHA256SUMS.txt
          cmp .scratch/e51z/NATIVE_BUILD_1 .scratch/e51z/NATIVE_BUILD_2
          echo 1 > .scratch/e51z/BYTE_IDENTICAL.txt

      - name: Execute E51Z native audit
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 16000 .scratch/e51z/NATIVE_BUILD_1 > .scratch/e51z/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          echo "$code" > .scratch/e51z/EXIT_CODE.txt
          echo "$((end-start))" > .scratch/e51z/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|e51y_parent_e50_integrity_gate|e51y_training_integrity_gate|e51y_terminal_reproduction|R32_E51Z_NATIVE|experiment_schema,tnn_r32_e51z|claim_boundary,evaluator_only|native_zag|learner_updates|evaluator_|oracle_action|audit_bucket|topology_|graph_|e51z_|TNN_R32_E51Z_)' .scratch/e51z/RAW.log > .scratch/e51z/SUMMARY.log || true
          cat .scratch/e51z/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51Z evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51z-native-${{ github.sha }}
          path: |
            .scratch/e51z/
            Research/R32_E51Z_STOPPING_STATE_ORACLE_AUDIT_PREREG.md
            Research/R32_E51Z_NATIVE/
            Research/R32_E51Y_FIVE_WAY_SEQUENTIAL_POLICY_PREREG.md
            Research/R32_E51Y_RESULT.md
            Research/R32_E51X_RESULT.md
            .github/scripts/e51x_assemble.py
            .github/scripts/e51y_assemble.py
            .github/scripts/e51z_assemble.py
          compression-level: 6
          if-no-files-found: error
