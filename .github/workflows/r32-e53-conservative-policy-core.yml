name: R32 E53 Conservative Policy Core

on:
  push:
    branches:
      - r32-e52-joint-action-value-frontier
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  native-core:
    name: E53 native conservative policy core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Record source and boundary hashes
        shell: bash
        run: |
          set -euo pipefail
          out='.scratch/e53-core'
          mkdir -p "$out"
          sha256sum \
            Research/tnn_r32_e53_conservative_policy_core.zag \
            Research/R32_E53_CONSERVATIVE_AVERAGE_COST_POLICY_PREREG.md \
            Research/R32_CONNECTIVITY_SUBSTRATE_BOUNDARY.md \
            > "$out/SOURCE_SHA256.txt"
          cat "$out/SOURCE_SHA256.txt"

      - name: Compile twice with persisted official Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          out='.scratch/e53-core'
          compiler='Research/toolchain/znc_linux_x86_64_abed8aa1'
          src='Research/tnn_r32_e53_conservative_policy_core.zag'
          chmod +x "$compiler"
          "$compiler" "$src" -o "$out/NATIVE_BUILD_1" > "$out/NATIVE_BUILD_1_COMPILE.log" 2>&1
          "$compiler" "$src" -o "$out/NATIVE_BUILD_2" > "$out/NATIVE_BUILD_2_COMPILE.log" 2>&1
          sha256sum "$out/NATIVE_BUILD_1" "$out/NATIVE_BUILD_2" | tee "$out/BINARY_SHA256.txt"
          cmp "$out/NATIVE_BUILD_1" "$out/NATIVE_BUILD_2"
          echo 1 > "$out/BYTE_IDENTICAL.txt"

      - name: Execute native core
        shell: bash
        run: |
          set -euo pipefail
          out='.scratch/e53-core'
          set +e
          "$out/NATIVE_BUILD_1" > "$out/RUNTIME.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$out/EXIT_CODE.txt"
          cat "$out/RUNTIME.log"
          test "$code" -eq 0
          grep -q '^TNN_R32_E53_CONSERVATIVE_POLICY_CORE_GATE=PASS$' "$out/RUNTIME.log"
          grep -q '^unknown_value_zero,1$' "$out/RUNTIME.log"
          grep -q '^graph_substrate_required,0$' "$out/RUNTIME.log"

      - name: Preserve native evidence
        uses: actions/upload-artifact@v4
        with:
          name: r32-e53-conservative-policy-core-${{ github.sha }}
          path: |
            .scratch/e53-core/
            Research/tnn_r32_e53_conservative_policy_core.zag
            Research/R32_E53_CONSERVATIVE_AVERAGE_COST_POLICY_PREREG.md
            Research/R32_CONNECTIVITY_SUBSTRATE_BOUNDARY.md
          if-no-files-found: error
          compression-level: 6