name: R32 E51X Extended Trajectory Dose

on:
  push:
    branches:
      - r32-agent-sequential-frontier
    paths:
      - 'Research/R32_E51X_EXTENDED_TRAJECTORY_DOSE_PREREG.md'
      - '.github/scripts/e51x_assemble.py'
      - '.github/workflows/r32-e51x-native.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble native E51X discriminator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51x
          cp Research/tnn_r32_e45_investigation_core.zag .scratch/e51x/tnn_r32_e45_investigation_core.zag
          python3 .github/scripts/e51x_assemble.py
          sha256sum \
            .scratch/e51x/E51X_01.zag \
            .scratch/e51x/E51X_02.zag \
            .scratch/e51x/E51X_INJECTION.zag \
            .scratch/e51x/E51X_FRAGMENT.zag \
            Research/R32_E51X_EXTENDED_TRAJECTORY_DOSE_PREREG.md \
            .scratch/e51x/tnn_r32_e51x_extended_trajectory_dose.zag \
            .scratch/e51x/tnn_r32_e45_investigation_core.zag \
            | tee .scratch/e51x/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          c=Research/toolchain/znc_linux_x86_64_abed8aa1
          s=.scratch/e51x/tnn_r32_e51x_extended_trajectory_dose.zag
          chmod +x "$c"
          "$c" "$s" -o .scratch/e51x/NATIVE_BUILD_1 > .scratch/e51x/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$c" "$s" -o .scratch/e51x/NATIVE_BUILD_2 > .scratch/e51x/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51x/NATIVE_BUILD_1 .scratch/e51x/NATIVE_BUILD_2 | tee .scratch/e51x/BINARY_SHA256SUMS.txt
          cmp .scratch/e51x/NATIVE_BUILD_1 .scratch/e51x/NATIVE_BUILD_2
          echo 1 > .scratch/e51x/BYTE_IDENTICAL.txt

      - name: Execute E51X native discriminator
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 10800 .scratch/e51x/NATIVE_BUILD_1 > .scratch/e51x/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          echo "$code" > .scratch/e51x/EXIT_CODE.txt
          echo "$((end-start))" > .scratch/e51x/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|R32_E51X_NATIVE|experiment_schema,tnn_r32_e51x|claim_boundary|native_zag|evaluator_|ambiguity_|validation_membership|unknown_positive|commit_order|routing_cells|new_features|cross_cell|graph_|trajectory_objective|only_optimization|lowest_dose|e51x_|TNN_R32_E51X_)' .scratch/e51x/RAW.log > .scratch/e51x/SUMMARY.log || true
          cat .scratch/e51x/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51X evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51x-native-${{ github.sha }}
          path: |
            .scratch/e51x/
            Research/R32_E51X_EXTENDED_TRAJECTORY_DOSE_PREREG.md
            Research/R32_E51W_RESULT.md
            .github/scripts/e51x_assemble.py
          compression-level: 6
          if-no-files-found: error
