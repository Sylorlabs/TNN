name: R32 E51AC Additive Direct Candidate Hybrid

on:
  push:
    branches: [r32-agent-sequential-frontier]
    paths:
      - 'Research/R32_E51AC_ADDITIVE_DIRECT_CANDIDATE_HYBRID_PREREG.md'
      - 'Research/R32_E51AC_NATIVE/**'
      - 'Research/R32_E51AB_NATIVE/01_direct_candidate_actions.zagfrag'
      - '.github/scripts/e51x_assemble.py'
      - '.github/scripts/e51y_assemble.py'
      - '.github/scripts/e51ac_assemble.py'
      - '.github/workflows/r32-e51ac-native.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble frozen terminal lineage plus additive hybrid
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/e51x_assemble.py
          python3 .github/scripts/e51y_assemble.py
          python3 .github/scripts/e51ac_assemble.py
          sha256sum \
            Research/R32_E51AC_ADDITIVE_DIRECT_CANDIDATE_HYBRID_PREREG.md \
            Research/R32_E51AB_NATIVE/01_direct_candidate_actions.zagfrag \
            Research/R32_E51AC_NATIVE/01_hybrid_direct_candidate.zagfrag \
            Research/R32_E51AC_NATIVE/02_run_and_gates.zagfrag \
            Research/R32_E51AC_NATIVE/03_main_injection.zagfrag \
            .github/scripts/e51ac_assemble.py \
            .scratch/e51ac/E51AC_FRAGMENT.zag \
            .scratch/e51ac/tnn_r32_e51ac_additive_direct_candidate_hybrid.zag \
            .scratch/e51ac/tnn_r32_e45_investigation_core.zag \
            | tee .scratch/e51ac/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler='Research/toolchain/znc_linux_x86_64_abed8aa1'
          src='.scratch/e51ac/tnn_r32_e51ac_additive_direct_candidate_hybrid.zag'
          chmod +x "$compiler"
          "$compiler" "$src" -o .scratch/e51ac/NATIVE_BUILD_1 > .scratch/e51ac/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$compiler" "$src" -o .scratch/e51ac/NATIVE_BUILD_2 > .scratch/e51ac/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51ac/NATIVE_BUILD_1 .scratch/e51ac/NATIVE_BUILD_2 | tee .scratch/e51ac/BINARY_SHA256SUMS.txt
          cmp .scratch/e51ac/NATIVE_BUILD_1 .scratch/e51ac/NATIVE_BUILD_2
          echo 1 > .scratch/e51ac/BYTE_IDENTICAL.txt

      - name: Execute E51AC native discriminator
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 16000 .scratch/e51ac/NATIVE_BUILD_1 > .scratch/e51ac/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          echo "$code" > .scratch/e51ac/EXIT_CODE.txt
          echo "$((end-start))" > .scratch/e51ac/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|e51y_parent_e50_integrity_gate|e51y_terminal_reproduction|R32_E51AC_NATIVE|experiment_schema,tnn_r32_e51ac|claim_boundary,native_hybrid|native_zag|mature_slot|candidate_interface|evaluator_|ambiguity_|unknown_|topology_|graph_|e51ac_|TNN_R32_E51AC_)' .scratch/e51ac/RAW.log > .scratch/e51ac/SUMMARY.log || true
          cat .scratch/e51ac/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51AC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51ac-native-${{ github.sha }}
          path: |
            .scratch/e51ac/
            Research/R32_E51AC_ADDITIVE_DIRECT_CANDIDATE_HYBRID_PREREG.md
            Research/R32_E51AC_NATIVE/
            Research/R32_E51AB_RESULT.md
            Research/R32_E51AB_DIRECT_CANDIDATE_COMMIT_PREREG.md
            Research/R32_E51AA_RESULT.md
            Research/R32_E51Y_RESULT.md
            .github/scripts/e51x_assemble.py
            .github/scripts/e51y_assemble.py
            .github/scripts/e51ac_assemble.py
          compression-level: 6
          if-no-files-found: error
