name: R32 E51N Domain-Separated RNG Replication

on:
  push:
    branches: [r32-agent-sequential-frontier]
    paths:
      - 'Research/R32_E51N_NATIVE/**'
      - 'Research/R32_E51N_DOMAIN_SEPARATED_WORLD_RNG_PREREG.md'
      - '.github/workflows/r32-e51n-native.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble native E51N with evaluator-only replacements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51n
          cp Research/tnn_r32_e45_investigation_core.zag .scratch/e51n/tnn_r32_e45_investigation_core.zag
          python3 - <<'PY'
          from pathlib import Path
          e51e = ''.join(Path(p).read_text() for p in [
              'Research/R32_E51E_NATIVE/00_compat.zagfrag',
              'Research/R32_E51E_NATIVE/01_joint_action_value.zagfrag',
              'Research/R32_E51E_NATIVE/02_validation.zagfrag',
              'Research/R32_E51E_NATIVE/03_run_and_gates.zagfrag',
          ])
          old = 'fn e51e_build_training_episode('
          assert e51e.count(old) == 1, e51e.count(old)
          e51e = e51e.replace(old, 'fn e51e_build_training_episode_retired_seed_coupled(', 1)
          Path('.scratch/e51n/E51E_PATCHED.zag').write_text(e51e)

          e51m = Path('Research/R32_E51M_NATIVE/01_calibration_curve.zagfrag').read_text()
          old = 'fn e51m_allocate_seeds('
          assert e51m.count(old) == 1, e51m.count(old)
          e51m = e51m.replace(old, 'fn e51m_allocate_seeds_retired_exhausted(', 1)
          Path('.scratch/e51n/E51M_PATCHED.zag').write_text(e51m)

          e51n = Path('Research/R32_E51N_NATIVE/01_domain_rng.zagfrag').read_text()
          old = 'fn e51n_make_truth('
          assert e51n.count(old) == 1, e51n.count(old)
          e51n = e51n.replace(old, 'fn e51n_make_truth_retired_extra_draw(', 1)
          Path('.scratch/e51n/E51N_DOMAIN_PATCHED.zag').write_text(e51n)
          PY
          cat Research/R32_E51B_NATIVE/01_core_and_seed.zagfrag \
              Research/R32_E51B_NATIVE/02_targets_and_metrics.zagfrag \
              Research/R32_E51B_NATIVE/03_validation_and_fit_setup.zagfrag \
              Research/R32_E51B_NATIVE/04_fit_validation_gates.zagfrag \
              .scratch/e51n/E51E_PATCHED.zag \
              .scratch/e51n/E51M_PATCHED.zag \
              .scratch/e51n/E51N_DOMAIN_PATCHED.zag \
              Research/R32_E51N_NATIVE/02_truth_fix.zagfrag \
              > .scratch/e51n/E51N_FRAGMENT.zag
          python3 - <<'PY'
          from pathlib import Path
          src = Path('Research/tnn_r32_e50_provenance_temporal_contention_discriminator.zag').read_text()
          frag = Path('.scratch/e51n/E51N_FRAGMENT.zag').read_text()
          injection = Path('Research/R32_E51N_NATIVE/03_main_injection.zagfrag').read_text()
          marker = 'fn main()i32 {'
          assert src.count(marker) == 1, src.count(marker)
          src = src.replace(marker, frag + '\n\n' + marker, 1)
          anchor = 'let aux_frozen_gate:i32=0; if(aux_frozen_hash==frozen_aux_hash){ aux_frozen_gate=1; } e45_print_pair("e50_aux_frozen_gate",aux_frozen_gate);'
          assert src.count(anchor) == 1, src.count(anchor)
          src = src.replace(anchor, anchor + '\n' + injection, 1)
          Path('.scratch/e51n/tnn_r32_e51n_domain_rng_replication.zag').write_text(src)
          PY
          sha256sum .scratch/e51n/E51E_PATCHED.zag \
                    .scratch/e51n/E51M_PATCHED.zag \
                    .scratch/e51n/E51N_DOMAIN_PATCHED.zag \
                    Research/R32_E51N_NATIVE/02_truth_fix.zagfrag \
                    Research/R32_E51N_NATIVE/03_main_injection.zagfrag \
                    .scratch/e51n/E51N_FRAGMENT.zag \
                    .scratch/e51n/tnn_r32_e51n_domain_rng_replication.zag \
                    .scratch/e51n/tnn_r32_e45_investigation_core.zag \
                    | tee .scratch/e51n/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler='Research/toolchain/znc_linux_x86_64_abed8aa1'
          src='.scratch/e51n/tnn_r32_e51n_domain_rng_replication.zag'
          chmod +x "$compiler"
          "$compiler" "$src" -o .scratch/e51n/NATIVE_BUILD_1 > .scratch/e51n/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$compiler" "$src" -o .scratch/e51n/NATIVE_BUILD_2 > .scratch/e51n/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51n/NATIVE_BUILD_1 .scratch/e51n/NATIVE_BUILD_2 | tee .scratch/e51n/BINARY_SHA256SUMS.txt
          cmp .scratch/e51n/NATIVE_BUILD_1 .scratch/e51n/NATIVE_BUILD_2
          echo 1 > .scratch/e51n/BYTE_IDENTICAL.txt

      - name: Execute E51N native replication
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 6600 .scratch/e51n/NATIVE_BUILD_1 > .scratch/e51n/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          printf '%s\n' "$code" > .scratch/e51n/EXIT_CODE.txt
          printf '%s\n' "$((end-start))" > .scratch/e51n/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|R32_E51N_NATIVE|experiment_schema,tnn_r32_e51n|e51n_|R32_E51M_NATIVE|experiment_schema,tnn_r32_e51m|claim_boundary|native_zag|evaluator_|ambiguity_|validation_membership|unknown_positive|topology_|graph_|e51m_|TNN_R32_E51M_|TNN_R32_E51N_)' .scratch/e51n/RAW.log > .scratch/e51n/SUMMARY.log || true
          cat .scratch/e51n/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51N evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51n-native-${{ github.sha }}
          path: |
            .scratch/e51n/
            Research/R32_E51N_DOMAIN_SEPARATED_WORLD_RNG_PREREG.md
            Research/R32_E51M_CALIBRATION_DOSE_CAPACITY_CURVE_PREREG.md
            Research/R32_E51N_NATIVE/
          compression-level: 6
          if-no-files-found: error
