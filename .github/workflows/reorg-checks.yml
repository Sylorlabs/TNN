name: reorg-checks

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required INDEX.md files exist
        run: |
          fail=0
          for d in docs/generations/*/; do
            [ -f "${d}INDEX.md" ] || { echo "missing: ${d}INDEX.md"; fail=1; }
          done
          for f in docs/INDEX.md docs/program/INDEX.md docs/hypotheses/INDEX.md \
                   docs/hypotheses/MATRIX.md \
                   src/INDEX.md src/experiments/INDEX.md src/tools/INDEX.md src/zag/INDEX.md \
                   data/INDEX.md artifacts/INDEX.md artifacts/run-logs/INDEX.md \
                   artifacts/checkpoints/INDEX.md \
                   archive/INDEX.md archive/transfer-staging/INDEX.md archive/run-archives/INDEX.md; do
            [ -f "$f" ] || { echo "missing: $f"; fail=1; }
          done
          exit $fail

      - name: Research/ top-level directory is gone
        run: |
          [ ! -d Research ] || { echo "Research/ still exists at top level"; exit 1; }

      - name: No __pycache__ directories
        run: |
          if find . -name __pycache__ | grep -q .; then echo "__pycache__ found"; exit 1; fi

      - name: No new download/transfer junk
        run: |
          if git ls-files | grep -E '\.openai-download-' | grep -qv '^docs/generations/'; then
            echo "new .openai-download- files outside docs/generations/"; exit 1; fi
