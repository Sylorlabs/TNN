name: R32 E51AJ Shared-Start Replay Order Dose
on:
  workflow_dispatch:
  push:
    branches: [r32-agent-sequential-frontier]
    paths:
      - 'Research/R32_E51AJ_REPLAY_ORDER_DOSE_PREREG.md'
      - 'Research/R32_E51AJ_HARDCODING_LEDGER.json'
      - 'Research/R32_E51AJ_SOURCE_PIN.json'
      - 'Research/R32_E51AJ_NATIVE/**'
      - '.github/scripts/e51aj_*.py'
      - '.github/workflows/r32-e51aj-native.yml'
permissions:
  contents: read
concurrency:
  group: e51aj-single-scientific-invocation
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - name: Checkout frozen project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble frozen source and synthetic verifier tests
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/scripts/e51aj_verify_test.py
          python3 -B .github/scripts/e51aj_assemble.py
          test "$(cat .scratch/e51aj/SOURCE_PIN_GATE.txt)" = 1
          git rev-parse HEAD > .scratch/e51aj/SOURCE_COMMIT.txt
          printf '%s\n' "$GITHUB_RUN_ID" > .scratch/e51aj/WORKFLOW_RUN_ID.txt
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > .scratch/e51aj/RUN_ATTEMPT.txt
          sha256sum Research/toolchain/znc_linux_x86_64_abed8aa1 > .scratch/e51aj/COMPILER_SHA256SUMS.txt
          printf '%s  %s\n' '498abcb5ab346f8cb246222a1ca63699d035a4277dedfba4782e1373137e58ef' 'Research/toolchain/znc_linux_x86_64_abed8aa1' | sha256sum --check
          { uname -a; python3 --version; } > .scratch/e51aj/RUNTIME_ENVIRONMENT.txt
      - name: Compile twice with official native compiler
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          compiler=Research/toolchain/znc_linux_x86_64_abed8aa1
          chmod +x "$compiler"
          "$compiler" .scratch/e51aj/SOURCE.zag --no-zagd --no-analyze --no-foreground-cache -o .scratch/e51aj/NATIVE_BUILD_1 > .scratch/e51aj/BUILD_1.log 2>&1
          "$compiler" .scratch/e51aj/SOURCE.zag --no-zagd --no-analyze --no-foreground-cache -o .scratch/e51aj/NATIVE_BUILD_2 > .scratch/e51aj/BUILD_2.log 2>&1
          cmp .scratch/e51aj/NATIVE_BUILD_1 .scratch/e51aj/NATIVE_BUILD_2
          sha256sum .scratch/e51aj/NATIVE_BUILD_1 .scratch/e51aj/NATIVE_BUILD_2 > .scratch/e51aj/BINARY_SHA256SUMS.txt
          echo 1 > .scratch/e51aj/BYTE_IDENTICAL.txt
      - name: Native synthetic tests without scientific exposure
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/scripts/e51aj_preflight.py
          Research/toolchain/znc_linux_x86_64_abed8aa1 .scratch/e51aj/preflight/SELFTEST.zag --no-zagd --no-analyze --no-foreground-cache -o .scratch/e51aj/preflight/SELFTEST > .scratch/e51aj/preflight/BUILD.log 2>&1
          timeout 60 .scratch/e51aj/preflight/SELFTEST > .scratch/e51aj/preflight/RESULT.log 2>&1
          grep -qx 'E51AJ_SYNTHETIC_SELFTESTS_PASS=1' .scratch/e51aj/preflight/RESULT.log
      - name: Execute fixed three-replica longitudinal schedule
        timeout-minutes: 95
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/scripts/e51aj_run.py
          python3 -B .github/scripts/e51aj_verify.py .scratch/e51aj
      - name: Preserve complete or partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51aj-native-${{ github.sha }}
          path: .scratch/e51aj/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 6
