name: TNN Native Toolchain Export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          sha256sum Research/toolchain/znc_linux_x86_64_abed8aa1 | tee ZNC_SHA256.txt
          chmod +x Research/toolchain/znc_linux_x86_64_abed8aa1
          Research/toolchain/znc_linux_x86_64_abed8aa1 --help >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: tnn-zag-native-compiler-${{ github.sha }}
          path: |
            Research/toolchain/znc_linux_x86_64_abed8aa1
            ZNC_SHA256.txt
          compression-level: 0
          if-no-files-found: error
