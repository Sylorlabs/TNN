name: R32 E51AA Resource Feasible Terminal Audit

on:
  push:
    branches:
      - r32-agent-sequential-frontier
    paths:
      - 'Research/R32_E51AA_RESOURCE_FEASIBLE_TERMINAL_DECOMPOSITION_PREREG.md'
      - 'Research/R32_E51AA_NATIVE/**'
      - '.github/scripts/e51aa_assemble.py'
      - '.github/workflows/r32-e51aa-native.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble frozen terminal learner plus E51AA audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51aa
          python3 .github/scripts/e51x_assemble.py
          python3 .github/scripts/e51y_assemble.py
          python3 .github/scripts/e51aa_assemble.py
          sha256sum \
            Research/R32_E51AA_RESOURCE_FEASIBLE_TERMINAL_DECOMPOSITION_PREREG.md \
            Research/R32_E51AA_NATIVE/01_resource_terminal_audit.zagfrag \
            Research/R32_E51AA_NATIVE/02_audit_injection.zagfrag \
            .github/scripts/e51aa_assemble.py \
            .scratch/e51aa/tnn_r32_e51aa_resource_terminal_decomposition.zag \
            .scratch/e51aa/tnn_r32_e45_investigation_core.zag \
            | tee .scratch/e51aa/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          c=Research/toolchain/znc_linux_x86_64_abed8aa1
          s=.scratch/e51aa/tnn_r32_e51aa_resource_terminal_decomposition.zag
          chmod +x "$c"
          "$c" "$s" -o .scratch/e51aa/NATIVE_BUILD_1 > .scratch/e51aa/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$c" "$s" -o .scratch/e51aa/NATIVE_BUILD_2 > .scratch/e51aa/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51aa/NATIVE_BUILD_1 .scratch/e51aa/NATIVE_BUILD_2 | tee .scratch/e51aa/BINARY_SHA256SUMS.txt
          cmp .scratch/e51aa/NATIVE_BUILD_1 .scratch/e51aa/NATIVE_BUILD_2
          echo 1 > .scratch/e51aa/BYTE_IDENTICAL.txt

      - name: Execute E51AA native audit
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 12000 .scratch/e51aa/NATIVE_BUILD_1 > .scratch/e51aa/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          echo "$code" > .scratch/e51aa/EXIT_CODE.txt
          echo "$((end-start))" > .scratch/e51aa/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|e51y_parent_e50_integrity_gate|e51y_terminal_reproduction|R32_E51AA_NATIVE|experiment_schema,tnn_r32_e51aa|claim_boundary,evaluator_only|native_zag|learner_updates|evaluator_|audit_category|topology_|graph_|e51aa_|TNN_R32_E51AA_)' .scratch/e51aa/RAW.log > .scratch/e51aa/SUMMARY.log || true
          cat .scratch/e51aa/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51AA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51aa-native-${{ github.sha }}
          path: |
            .scratch/e51aa/
            Research/R32_E51AA_RESOURCE_FEASIBLE_TERMINAL_DECOMPOSITION_PREREG.md
            Research/R32_E51AA_NATIVE/
            Research/R32_E51Z_RESULT.md
            Research/R32_E51Y_RESULT.md
            Research/R32_E51X_RESULT.md
            .github/scripts/e51x_assemble.py
            .github/scripts/e51y_assemble.py
            .github/scripts/e51aa_assemble.py
          compression-level: 6
          if-no-files-found: error
