name: R32 E51M Calibration Dose Capacity Curve

on:
  push:
    branches: [r32-agent-sequential-frontier]
    paths:
      - 'Research/R32_E51M_NATIVE/01_calibration_curve.zagfrag'
      - 'Research/R32_E51M_NATIVE/02_main_injection.zagfrag'
      - 'Research/R32_E51M_CALIBRATION_DOSE_CAPACITY_CURVE_PREREG.md'
      - '.github/workflows/r32-e51m-native.yml'

concurrency:
  group: r32-e51m-native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble preregistered native E51M curve
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51m
          cp Research/tnn_r32_e45_investigation_core.zag .scratch/e51m/tnn_r32_e45_investigation_core.zag
          cat Research/R32_E51B_NATIVE/01_core_and_seed.zagfrag \
              Research/R32_E51B_NATIVE/02_targets_and_metrics.zagfrag \
              Research/R32_E51B_NATIVE/03_validation_and_fit_setup.zagfrag \
              Research/R32_E51B_NATIVE/04_fit_validation_gates.zagfrag \
              Research/R32_E51E_NATIVE/00_compat.zagfrag \
              Research/R32_E51E_NATIVE/01_joint_action_value.zagfrag \
              Research/R32_E51E_NATIVE/02_validation.zagfrag \
              Research/R32_E51E_NATIVE/03_run_and_gates.zagfrag \
              Research/R32_E51M_NATIVE/01_calibration_curve.zagfrag \
              > .scratch/e51m/E51M_FRAGMENT.zag
          python3 - <<'PY'
          from pathlib import Path

          src = Path('Research/tnn_r32_e50_provenance_temporal_contention_discriminator.zag').read_text()
          frag = Path('.scratch/e51m/E51M_FRAGMENT.zag').read_text()
          injection = Path('Research/R32_E51M_NATIVE/02_main_injection.zagfrag').read_text()

          # E51M development and validation remain in the historical effective-state
          # namespace. The sealed confirmation partition is not executed unless the
          # exact validation gate passes. The old 1,000,003-state allocator is already
          # saturated by the maximum development + validation request, so reserving
          # confirmation through that allocator can perform billions of futile probes.
          # Allocate deterministic nominal sealed IDs instead. A future exact validation
          # rescue must preregister an expanded executable confirmation namespace before
          # those streams may be opened.
          old_confirmation = '''                    let seed:i32=e46_assign_fresh_seed(raw_seen,evidence_seen,resource_seen,54,index,mode,resource,&failures);
                    confirmation_seeds[index]=seed;'''
          new_confirmation = '''                    let seed:i32=1000003+index+1;
                    confirmation_seeds[index]=seed;'''
          assert frag.count(old_confirmation) == 1, frag.count(old_confirmation)
          frag = frag.replace(old_confirmation, new_confirmation, 1)

          old_audit = '    e45_print_pair("e51m_sealed_confirmation_executed",0);'
          new_audit = '''    e45_print_pair("e51m_sealed_confirmation_executed",0);
    e45_print_pair("e51m_sealed_confirmation_nominal_namespace",1);
    e45_print_pair("e51m_sealed_confirmation_effective_streams_reserved",0);'''
          assert frag.count(old_audit) == 1, frag.count(old_audit)
          frag = frag.replace(old_audit, new_audit, 1)

          old_open = '    if(integrity_gate==1 && exact_gate==1 && winning_arm>=0){'
          new_open = '    if(integrity_gate==1 && exact_gate==1 && winning_arm>=0 && 0==1){'
          assert frag.count(old_open) == 1, frag.count(old_open)
          frag = frag.replace(old_open, new_open, 1)

          main_marker = 'fn main()i32 {'
          assert src.count(main_marker) == 1, src.count(main_marker)
          src = src.replace(main_marker, frag + '\n\n' + main_marker, 1)
          anchor = 'let aux_frozen_gate:i32=0; if(aux_frozen_hash==frozen_aux_hash){ aux_frozen_gate=1; } e45_print_pair("e50_aux_frozen_gate",aux_frozen_gate);'
          assert src.count(anchor) == 1, src.count(anchor)
          src = src.replace(anchor, anchor + '\n' + injection, 1)
          Path('.scratch/e51m/E51M_FRAGMENT.zag').write_text(frag)
          Path('.scratch/e51m/tnn_r32_e51m_calibration_curve.zag').write_text(src)
          PY
          sha256sum .scratch/e51m/E51M_FRAGMENT.zag \
                    Research/R32_E51M_NATIVE/01_calibration_curve.zagfrag \
                    Research/R32_E51M_NATIVE/02_main_injection.zagfrag \
                    .scratch/e51m/tnn_r32_e51m_calibration_curve.zag \
                    .scratch/e51m/tnn_r32_e45_investigation_core.zag \
                    | tee .scratch/e51m/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler='Research/toolchain/znc_linux_x86_64_abed8aa1'
          src='.scratch/e51m/tnn_r32_e51m_calibration_curve.zag'
          chmod +x "$compiler"
          "$compiler" "$src" -o .scratch/e51m/NATIVE_BUILD_1 > .scratch/e51m/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$compiler" "$src" -o .scratch/e51m/NATIVE_BUILD_2 > .scratch/e51m/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51m/NATIVE_BUILD_1 .scratch/e51m/NATIVE_BUILD_2 | tee .scratch/e51m/BINARY_SHA256SUMS.txt
          cmp .scratch/e51m/NATIVE_BUILD_1 .scratch/e51m/NATIVE_BUILD_2
          echo 1 > .scratch/e51m/BYTE_IDENTICAL.txt

      - name: Execute E51M native curve
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 6600 .scratch/e51m/NATIVE_BUILD_1 > .scratch/e51m/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          printf '%s\n' "$code" > .scratch/e51m/EXIT_CODE.txt
          printf '%s\n' "$((end-start))" > .scratch/e51m/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|R32_E51M_NATIVE|experiment_schema,tnn_r32_e51m|claim_boundary|native_zag|evaluator_|ambiguity_|validation_membership|unknown_positive|topology_|graph_|e51m_|TNN_R32_E51M_)' .scratch/e51m/RAW.log > .scratch/e51m/SUMMARY.log || true
          cat .scratch/e51m/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51M evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51m-native-${{ github.sha }}
          path: |
            .scratch/e51m/
            Research/R32_E51M_CALIBRATION_DOSE_CAPACITY_CURVE_PREREG.md
            Research/R32_E51M_NATIVE/01_calibration_curve.zagfrag
            Research/R32_E51M_NATIVE/02_main_injection.zagfrag
            .github/workflows/r32-e51m-native.yml
          compression-level: 6
          if-no-files-found: error
