name: R32 E51AG Current Residual Replication Audit

on:
  push:
    branches:
      - r32-agent-sequential-frontier
    paths:
      - 'Research/R32_E51AG_CURRENT_RESIDUAL_REPLICATION_PREREG.md'
      - 'Research/R32_E51AG_IMPLEMENTATION_CONTRACT.md'
      - 'Research/R32_E51AG_HARDCODING_LEDGER.md'
      - 'Research/R32_E51AG_NATIVE/**'
      - '.github/scripts/e51ag_assemble.py'
      - '.github/workflows/r32-e51ag-native.yml'
      - 'Research/R32_E51AE_NATIVE/01a_contract_selection.zagfrag'
      - 'Research/R32_E51AE_NATIVE/01b_objective_fit.zagfrag'
      - 'Research/R32_E51AE_NATIVE/01c_evaluation.zagfrag'
      - 'Research/R32_E51AE_NATIVE/02a_run_direct.zagfrag'
      - 'Research/R32_E51AE_NATIVE/02b_run_development.zagfrag'
      - 'Research/R32_E51AE_NATIVE/02c_run_local.zagfrag'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble frozen current lineage plus E51AG replication tail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51ag
          python3 .github/scripts/e51x_assemble.py
          python3 .github/scripts/e51y_assemble.py
          python3 .github/scripts/e51ad_assemble.py
          python3 .github/scripts/e51ag_assemble.py
          test "$(cat .scratch/e51ag/SOURCE_PIN_GATE.txt)" = "1"
          sha256sum \
            Research/R32_E51AG_CURRENT_RESIDUAL_REPLICATION_PREREG.md \
            Research/R32_E51AG_IMPLEMENTATION_CONTRACT.md \
            Research/R32_E51AG_HARDCODING_LEDGER.md \
            Research/R32_E51AG_NATIVE/01d_replication_contract.zagfrag \
            Research/R32_E51AG_NATIVE/02d_run_replication.zagfrag \
            Research/R32_E51AG_NATIVE/03_main_injection.zagfrag \
            .github/scripts/e51ag_assemble.py \
            .scratch/e51ag/E51AG_FRAGMENT.zag \
            .scratch/e51ag/tnn_r32_e51ag_current_residual_replication.zag \
            .scratch/e51ag/tnn_r32_e45_investigation_core.zag \
            | tee .scratch/e51ag/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          c=Research/toolchain/znc_linux_x86_64_abed8aa1
          s=.scratch/e51ag/tnn_r32_e51ag_current_residual_replication.zag
          chmod +x "$c"
          "$c" "$s" -o .scratch/e51ag/NATIVE_BUILD_1 > .scratch/e51ag/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$c" "$s" -o .scratch/e51ag/NATIVE_BUILD_2 > .scratch/e51ag/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51ag/NATIVE_BUILD_1 .scratch/e51ag/NATIVE_BUILD_2 | tee .scratch/e51ag/BINARY_SHA256SUMS.txt
          cmp .scratch/e51ag/NATIVE_BUILD_1 .scratch/e51ag/NATIVE_BUILD_2
          echo 1 > .scratch/e51ag/BYTE_IDENTICAL.txt

      - name: Execute E51AG native replication audit
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 17000 .scratch/e51ag/NATIVE_BUILD_1 > .scratch/e51ag/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          echo "$code" > .scratch/e51ag/EXIT_CODE.txt
          echo "$((end-start))" > .scratch/e51ag/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|e51y_parent_e50_integrity_gate|e51y_terminal_reproduction|R32_E51AG_NATIVE|experiment_schema,tnn_r32_e51ag|claim_boundary,frozen_current|native_zag|mature_slot|frozen_direct|residual_features|candidate_action_interface|deployment_policy|evaluator_|ambiguity_|mode_resource|unknown_|topology_|graph_|e51ag_|TNN_R32_E51AG_)' .scratch/e51ag/RAW.log > .scratch/e51ag/SUMMARY.log || true
          cat .scratch/e51ag/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51AG evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51ag-native-${{ github.sha }}
          path: |
            .scratch/e51ag/
            Research/R32_E51AG_CURRENT_RESIDUAL_REPLICATION_PREREG.md
            Research/R32_E51AG_IMPLEMENTATION_CONTRACT.md
            Research/R32_E51AG_HARDCODING_LEDGER.md
            Research/R32_E51AG_NATIVE/01d_replication_contract.zagfrag
            Research/R32_E51AG_NATIVE/02d_run_replication.zagfrag
            Research/R32_E51AG_NATIVE/03_main_injection.zagfrag
            Research/R32_E51AE_RESULT.md
            Research/R32_E51AF_RESULT.md
            .github/scripts/e51x_assemble.py
            .github/scripts/e51y_assemble.py
            .github/scripts/e51ad_assemble.py
            .github/scripts/e51ag_assemble.py
          compression-level: 6
          if-no-files-found: error
