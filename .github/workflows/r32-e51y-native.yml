name: R32 E51Y Five Way Sequential Policy

on:
  push:
    branches:
      - r32-agent-sequential-frontier
    paths:
      - 'Research/R32_E51Y_FIVE_WAY_SEQUENTIAL_POLICY_PREREG.md'
      - 'Research/R32_E51Y_NATIVE/**'
      - '.github/scripts/e51y_assemble.py'
      - '.github/workflows/r32-e51y-native.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble native E51Y discriminator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51y
          cp Research/tnn_r32_e45_investigation_core.zag .scratch/e51y/tnn_r32_e45_investigation_core.zag
          python3 .github/scripts/e51x_assemble.py
          python3 .github/scripts/e51y_assemble.py
          sha256sum \
            Research/R32_E51Y_NATIVE/01_sequential_helpers.zagfrag \
            .scratch/e51y/E51Y_RUN_PATCHED.zag \
            Research/R32_E51Y_NATIVE/03_main_injection.zagfrag \
            .scratch/e51y/E51Y_FRAGMENT.zag \
            Research/R32_E51Y_FIVE_WAY_SEQUENTIAL_POLICY_PREREG.md \
            .scratch/e51y/tnn_r32_e51y_five_way_sequential.zag \
            .scratch/e51y/tnn_r32_e45_investigation_core.zag \
            | tee .scratch/e51y/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          c=Research/toolchain/znc_linux_x86_64_abed8aa1
          s=.scratch/e51y/tnn_r32_e51y_five_way_sequential.zag
          chmod +x "$c"
          "$c" "$s" -o .scratch/e51y/NATIVE_BUILD_1 > .scratch/e51y/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$c" "$s" -o .scratch/e51y/NATIVE_BUILD_2 > .scratch/e51y/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51y/NATIVE_BUILD_1 .scratch/e51y/NATIVE_BUILD_2 | tee .scratch/e51y/BINARY_SHA256SUMS.txt
          cmp .scratch/e51y/NATIVE_BUILD_1 .scratch/e51y/NATIVE_BUILD_2
          echo 1 > .scratch/e51y/BYTE_IDENTICAL.txt

      - name: Execute E51Y native discriminator
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 14000 .scratch/e51y/NATIVE_BUILD_1 > .scratch/e51y/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          echo "$code" > .scratch/e51y/EXIT_CODE.txt
          echo "$((end-start))" > .scratch/e51y/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|R32_E51Y_NATIVE|experiment_schema,tnn_r32_e51y|claim_boundary|native_zag|evaluator_|ambiguity_|validation_membership|unknown_positive|terminal_topology|cross_cell|graph_|five_way|continue_geometry|e51y_|TNN_R32_E51Y_)' .scratch/e51y/RAW.log > .scratch/e51y/SUMMARY.log || true
          cat .scratch/e51y/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51Y evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51y-native-${{ github.sha }}
          path: |
            .scratch/e51y/
            Research/R32_E51Y_FIVE_WAY_SEQUENTIAL_POLICY_PREREG.md
            Research/R32_E51Y_NATIVE/
            Research/R32_E51X_RESULT.md
            .github/scripts/e51y_assemble.py
          compression-level: 6
          if-no-files-found: error
