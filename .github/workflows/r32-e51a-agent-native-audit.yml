name: R32 E51A Agent Native Audit

on:
  push:
    branches:
      - r32-agent-sequential-frontier
    paths:
      - 'Research/tnn_r32_e50_provenance_temporal_contention_discriminator.zag'
      - 'Research/toolchain/znc_linux_x86_64_abed8aa1'
      - '.github/workflows/r32-e51a-agent-native-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Research/tnn_r32_e50_provenance_temporal_contention_discriminator.zag'
      - 'Research/toolchain/znc_linux_x86_64_abed8aa1'
      - '.github/workflows/r32-e51a-agent-native-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    name: E51A arm ${{ matrix.arm }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arm: [A, B, C, D]
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Generate frozen arm
        shell: bash
        run: |
          set -euo pipefail
          arm='${{ matrix.arm }}'
          src="Research/tnn_r32_e51a_${arm}.zag"
          mkdir -p ".scratch/e51a/${arm}"
          cp Research/tnn_r32_e50_provenance_temporal_contention_discriminator.zag "$src"
          test "$(grep -cF 'fn e45_qualification_main_unused()i32 {' "$src")" -eq 1
          test "$(grep -cF 'fn main()i32 {' "$src")" -eq 1
          sed -i 's/^fn main()i32 {/fn e50_main_unused()i32 {/' "$src"
          sed -i 's/^fn e45_qualification_main_unused()i32 {/fn main()i32 {/' "$src"
          if [[ "$arm" == B || "$arm" == D ]]; then
            test "$(grep -cF 'if(training_phase==2 && learned_credit>0 && training_reachable==1){' "$src")" -eq 1
            sed -i 's/if(training_phase==2 && learned_credit>0 && training_reachable==1){/if(training_phase==2 \&\& training_reachable==1){/' "$src"
          fi
          if [[ "$arm" == C || "$arm" == D ]]; then
            test "$(grep -cF 'let continue_value:i32=e45_arm_continue_value(arm,predicted);' "$src")" -eq 1
            sed -i 's/let continue_value:i32=e45_arm_continue_value(arm,predicted);/let continue_value:i32=predicted;/' "$src"
          fi
          sha256sum "$src" | tee ".scratch/e51a/${arm}/SOURCE_SHA256.txt"
          printf 'arm=%s\n' "$arm" > ".scratch/e51a/${arm}/ARM.txt"
          grep -nF 'if(training_phase==2' "$src" > ".scratch/e51a/${arm}/TRAINING_GATE.txt"
          grep -nF 'let continue_value:i32=' "$src" > ".scratch/e51a/${arm}/CONTINUE_VALUE.txt"

      - name: Compile twice with persisted official Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          arm='${{ matrix.arm }}'
          src="Research/tnn_r32_e51a_${arm}.zag"
          out=".scratch/e51a/${arm}"
          compiler='Research/toolchain/znc_linux_x86_64_abed8aa1'
          chmod +x "$compiler"
          "$compiler" "$src" -o "$out/NATIVE_BUILD_1" > "$out/NATIVE_BUILD_1_COMPILE.log" 2>&1
          "$compiler" "$src" -o "$out/NATIVE_BUILD_2" > "$out/NATIVE_BUILD_2_COMPILE.log" 2>&1
          sha256sum "$out/NATIVE_BUILD_1" "$out/NATIVE_BUILD_2" | tee "$out/BINARY_SHA256.txt"
          cmp "$out/NATIVE_BUILD_1" "$out/NATIVE_BUILD_2"
          echo 1 > "$out/BYTE_IDENTICAL.txt"

      - name: Execute native arm
        shell: bash
        run: |
          set -euo pipefail
          arm='${{ matrix.arm }}'
          out=".scratch/e51a/${arm}"
          set +e
          timeout 3600 "$out/NATIVE_BUILD_1" > "$out/RAW.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$out/EXIT_CODE.txt"
          grep -E '^(TNN_R32_E45_NATIVE_QUALIFICATION_GATE=|no_unique_d_|known_truth_|causal_completion_regret_gate|baseline_parity_gate|oracle_positive_prevalence_|shadow_control_gate|core_gate_sum)' "$out/RAW.log" > "$out/SUMMARY.txt" || true
          cat "$out/SUMMARY.txt"
          echo "native_exit_code=$code"

      - name: Preserve arm evidence
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51a-${{ matrix.arm }}
          path: |
            .scratch/e51a/${{ matrix.arm }}/
            Research/tnn_r32_e51a_${{ matrix.arm }}.zag
          if-no-files-found: error
          compression-level: 6

  package:
    name: Package complete TNN project and E51A evidence
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Download all E51A evidence
        uses: actions/download-artifact@v4
        with:
          pattern: r32-e51a-*
          path: Research/R32_E51A_AGENT_RUN_EVIDENCE
          merge-multiple: false

      - name: Build run report
        shell: bash
        run: |
          set -euo pipefail
          report='Research/R32_E51A_AGENT_RUN_EVIDENCE/RUN_REPORT.md'
          {
            echo '# R32 E51A Agent Native Run'
            echo
            echo "Workflow commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            for arm in A B C D; do
              echo "## Arm $arm"
              p="Research/R32_E51A_AGENT_RUN_EVIDENCE/r32-e51a-$arm/.scratch/e51a/$arm"
              if [[ -f "$p/SUMMARY.txt" ]]; then
                echo '```text'
                cat "$p/SUMMARY.txt"
                echo '```'
                echo "Exit code: $(cat "$p/EXIT_CODE.txt")"
                echo "Byte-identical builds: $(cat "$p/BYTE_IDENTICAL.txt")"
              else
                echo 'Arm artifact unavailable; inspect workflow job status.'
              fi
              echo
            done
          } > "$report"
          cat "$report"

      - name: Zip the entire project snapshot
        shell: bash
        run: |
          set -euo pipefail
          archive="TNN-full-project-r32-e51a-${GITHUB_SHA}.zip"
          zip -q -r "$archive" . -x '.git/*' "$archive"
          sha256sum "$archive" > "${archive}.sha256"
          ls -lh "$archive" "${archive}.sha256"

      - name: Upload complete project archive
        uses: actions/upload-artifact@v4
        with:
          name: tnn-complete-r32-e51a-${{ github.sha }}
          path: |
            TNN-full-project-r32-e51a-${{ github.sha }}.zip
            TNN-full-project-r32-e51a-${{ github.sha }}.zip.sha256
            Research/R32_E51A_AGENT_RUN_EVIDENCE/RUN_REPORT.md
          if-no-files-found: error
          compression-level: 0
