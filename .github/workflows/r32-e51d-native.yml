name: R32 E51D Frozen Terminal Reachability Audit

on:
  push:
    branches: [r32-agent-sequential-frontier]
    paths:
      - 'Research/R32_E51D_NATIVE/**'
      - 'Research/R32_E51D_TERMINAL_REACHABILITY_AUDIT_PREREG.md'
      - '.github/workflows/r32-e51d-native.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble preregistered native audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51d
          cp Research/tnn_r32_e45_investigation_core.zag .scratch/e51d/tnn_r32_e45_investigation_core.zag
          cat Research/R32_E51B_NATIVE/01_core_and_seed.zagfrag \
              Research/R32_E51B_NATIVE/02_targets_and_metrics.zagfrag \
              Research/R32_E51B_NATIVE/03_validation_and_fit_setup.zagfrag \
              Research/R32_E51B_NATIVE/04_fit_validation_gates.zagfrag \
              Research/R32_E51D_NATIVE/01_terminal_reachability_audit.part-0.zagfrag \
              Research/R32_E51D_NATIVE/01_terminal_reachability_audit.part-1.zagfrag \
              Research/R32_E51D_NATIVE/01_terminal_reachability_audit.part-2.zagfrag \
              Research/R32_E51D_NATIVE/01_terminal_reachability_audit.part-3.zagfrag \
              > .scratch/e51d/E51D_FRAGMENT.zag
          python3 - <<'PY'
          from pathlib import Path
          src = Path('Research/tnn_r32_e50_provenance_temporal_contention_discriminator.zag').read_text()
          frag = Path('.scratch/e51d/E51D_FRAGMENT.zag').read_text()
          main_injection = Path('Research/R32_E51D_NATIVE/02_main_injection.zagfrag').read_text()
          main_marker = 'fn main()i32 {'
          assert src.count(main_marker) == 1, src.count(main_marker)
          src = src.replace(main_marker, frag + '\n\n' + main_marker, 1)
          anchor = 'let aux_frozen_gate:i32=0; if(aux_frozen_hash==frozen_aux_hash){ aux_frozen_gate=1; } e45_print_pair("e50_aux_frozen_gate",aux_frozen_gate);'
          assert src.count(anchor) == 1, src.count(anchor)
          src = src.replace(anchor, anchor + '\n' + main_injection, 1)
          Path('.scratch/e51d/tnn_r32_e51d_terminal_reachability_audit.zag').write_text(src)
          PY
          sha256sum .scratch/e51d/E51D_FRAGMENT.zag \
                    Research/R32_E51D_NATIVE/02_main_injection.zagfrag \
                    .scratch/e51d/tnn_r32_e51d_terminal_reachability_audit.zag \
                    .scratch/e51d/tnn_r32_e45_investigation_core.zag \
                    | tee .scratch/e51d/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler='Research/toolchain/znc_linux_x86_64_abed8aa1'
          src='.scratch/e51d/tnn_r32_e51d_terminal_reachability_audit.zag'
          chmod +x "$compiler"
          "$compiler" "$src" -o .scratch/e51d/NATIVE_BUILD_1 > .scratch/e51d/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$compiler" "$src" -o .scratch/e51d/NATIVE_BUILD_2 > .scratch/e51d/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51d/NATIVE_BUILD_1 .scratch/e51d/NATIVE_BUILD_2 | tee .scratch/e51d/BINARY_SHA256SUMS.txt
          cmp .scratch/e51d/NATIVE_BUILD_1 .scratch/e51d/NATIVE_BUILD_2
          echo 1 > .scratch/e51d/BYTE_IDENTICAL.txt

      - name: Execute E51D native audit
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 5400 .scratch/e51d/NATIVE_BUILD_1 > .scratch/e51d/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          printf '%s\n' "$code" > .scratch/e51d/EXIT_CODE.txt
          printf '%s\n' "$((end-start))" > .scratch/e51d/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|e51b_seed_|e51d_|TNN_R32_E51D_)' .scratch/e51d/RAW.log > .scratch/e51d/SUMMARY.log || true
          cat .scratch/e51d/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51d-native-${{ github.sha }}
          path: |
            .scratch/e51d/
            Research/R32_E51D_TERMINAL_REACHABILITY_AUDIT_PREREG.md
            Research/R32_E51D_NATIVE/
          compression-level: 6
          if-no-files-found: error
