name: R32 E51AE Trajectory-Critical Candidate Residual

on:
  push:
    branches:
      - r32-agent-sequential-frontier
    paths:
      - 'Research/R32_E51AE_TRAJECTORY_CRITICAL_CANDIDATE_RESIDUAL_PREREG.md'
      - 'Research/R32_E51AE_IMPLEMENTATION_CONTRACT.md'
      - 'Research/R32_E51AE_HARDCODING_LEDGER.md'
      - 'Research/R32_E51AE_NATIVE/01a_contract_selection.zagfrag'
      - 'Research/R32_E51AE_NATIVE/01b_objective_fit.zagfrag'
      - 'Research/R32_E51AE_NATIVE/01c_evaluation.zagfrag'
      - 'Research/R32_E51AE_NATIVE/02a_run_direct.zagfrag'
      - 'Research/R32_E51AE_NATIVE/02b_run_development.zagfrag'
      - 'Research/R32_E51AE_NATIVE/02c_run_local.zagfrag'
      - 'Research/R32_E51AE_NATIVE/02d_run_validation.zagfrag'
      - 'Research/R32_E51AE_NATIVE/03_main_injection.zagfrag'
      - '.github/scripts/e51ae_assemble.py'
      - '.github/workflows/r32-e51ae-native.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble frozen lineage plus E51AE residual treatment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51ae
          python3 .github/scripts/e51x_assemble.py
          python3 .github/scripts/e51y_assemble.py
          python3 .github/scripts/e51ad_assemble.py
          python3 .github/scripts/e51ae_assemble.py
          sha256sum \
            Research/R32_E51AE_TRAJECTORY_CRITICAL_CANDIDATE_RESIDUAL_PREREG.md \
            Research/R32_E51AE_IMPLEMENTATION_CONTRACT.md \
            Research/R32_E51AE_HARDCODING_LEDGER.md \
            Research/R32_E51AE_NATIVE/01a_contract_selection.zagfrag \
            Research/R32_E51AE_NATIVE/01b_objective_fit.zagfrag \
            Research/R32_E51AE_NATIVE/01c_evaluation.zagfrag \
            Research/R32_E51AE_NATIVE/02a_run_direct.zagfrag \
            Research/R32_E51AE_NATIVE/02b_run_development.zagfrag \
            Research/R32_E51AE_NATIVE/02c_run_local.zagfrag \
            Research/R32_E51AE_NATIVE/02d_run_validation.zagfrag \
            Research/R32_E51AE_NATIVE/03_main_injection.zagfrag \
            .github/scripts/e51ae_assemble.py \
            .scratch/e51ae/E51AE_FRAGMENT.zag \
            .scratch/e51ae/tnn_r32_e51ae_trajectory_critical_candidate_residual.zag \
            .scratch/e51ae/tnn_r32_e45_investigation_core.zag \
            | tee .scratch/e51ae/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          c=Research/toolchain/znc_linux_x86_64_abed8aa1
          s=.scratch/e51ae/tnn_r32_e51ae_trajectory_critical_candidate_residual.zag
          chmod +x "$c"
          "$c" "$s" -o .scratch/e51ae/NATIVE_BUILD_1 > .scratch/e51ae/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$c" "$s" -o .scratch/e51ae/NATIVE_BUILD_2 > .scratch/e51ae/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51ae/NATIVE_BUILD_1 .scratch/e51ae/NATIVE_BUILD_2 | tee .scratch/e51ae/BINARY_SHA256SUMS.txt
          cmp .scratch/e51ae/NATIVE_BUILD_1 .scratch/e51ae/NATIVE_BUILD_2
          echo 1 > .scratch/e51ae/BYTE_IDENTICAL.txt

      - name: Execute E51AE native discriminator
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 17000 .scratch/e51ae/NATIVE_BUILD_1 > .scratch/e51ae/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          echo "$code" > .scratch/e51ae/EXIT_CODE.txt
          echo "$((end-start))" > .scratch/e51ae/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|e51y_parent_e50_integrity_gate|e51y_terminal_reproduction|R32_E51AE_NATIVE|experiment_schema,tnn_r32_e51ae|claim_boundary,native_candidate|native_zag|mature_slot|frozen_direct|residual_features|candidate_action_interface|deployment_policy|evaluator_|ambiguity_|mode_resource|unknown_|topology_|graph_|e51ae_|TNN_R32_E51AE_)' .scratch/e51ae/RAW.log > .scratch/e51ae/SUMMARY.log || true
          cat .scratch/e51ae/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51AE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51ae-native-${{ github.sha }}
          path: |
            .scratch/e51ae/
            Research/R32_E51AE_TRAJECTORY_CRITICAL_CANDIDATE_RESIDUAL_PREREG.md
            Research/R32_E51AE_IMPLEMENTATION_CONTRACT.md
            Research/R32_E51AE_HARDCODING_LEDGER.md
            Research/R32_E51AE_NATIVE/01a_contract_selection.zagfrag
            Research/R32_E51AE_NATIVE/01b_objective_fit.zagfrag
            Research/R32_E51AE_NATIVE/01c_evaluation.zagfrag
            Research/R32_E51AE_NATIVE/02a_run_direct.zagfrag
            Research/R32_E51AE_NATIVE/02b_run_development.zagfrag
            Research/R32_E51AE_NATIVE/02c_run_local.zagfrag
            Research/R32_E51AE_NATIVE/02d_run_validation.zagfrag
            Research/R32_E51AE_NATIVE/03_main_injection.zagfrag
            Research/R32_E51AD_RESULT.md
            Research/R32_E51AC_RESULT.md
            Research/R32_E51AB_RESULT.md
            .github/scripts/e51x_assemble.py
            .github/scripts/e51y_assemble.py
            .github/scripts/e51ad_assemble.py
            .github/scripts/e51ae_assemble.py
          compression-level: 6
          if-no-files-found: error
