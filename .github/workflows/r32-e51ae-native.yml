name: R32 E51AE Trajectory-Critical Candidate Residual

on:
  push:
    branches: [r32-agent-sequential-frontier]
    paths:
      - 'Research/R32_E51AE_TRAJECTORY_CRITICAL_CANDIDATE_RESIDUAL_PREREG.md'
      - 'Research/R32_E51AE_NATIVE/**'
      - '.github/scripts/e51ae_assemble.py'
      - '.github/workflows/r32-e51ae-native.yml'

permissions:
  contents: read

concurrency:
  group: r32-e51ae-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble frozen lineage and E51AE candidate residual
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/e51x_assemble.py
          python3 .github/scripts/e51y_assemble.py
          python3 .github/scripts/e51ad_assemble.py
          python3 .github/scripts/e51ae_assemble.py
          sha256sum \
            Research/R32_E51AE_TRAJECTORY_CRITICAL_CANDIDATE_RESIDUAL_PREREG.md \
            Research/R32_E51AE_NATIVE/01a_contract_scores.zagfrag \
            Research/R32_E51AE_NATIVE/01b_support_selection.zagfrag \
            Research/R32_E51AE_NATIVE/01c_objective_fit.zagfrag \
            Research/R32_E51AE_NATIVE/01d_eval.zagfrag \
            Research/R32_E51AE_NATIVE/02a_direct_reconstruction.zagfrag \
            Research/R32_E51AE_NATIVE/02b_residual_training.zagfrag.gz \
            Research/R32_E51AE_NATIVE/02c_validation_outcome.zagfrag.gz \
            Research/R32_E51AE_NATIVE/03_main_injection.zagfrag \
            Research/R32_E51AE_NATIVE/TRANSPORT_NOTE.md \
            .github/scripts/e51ae_assemble.py \
            .scratch/e51ae/E51AE_FRAGMENT.zag \
            .scratch/e51ae/tnn_r32_e51ae_trajectory_critical_candidate_residual.zag \
            .scratch/e51ae/tnn_r32_e45_investigation_core.zag \
            | tee .scratch/e51ae/SOURCE_SHA256SUMS.txt
          test "$(sha256sum .scratch/e51ae/E51AE_FRAGMENT.zag | awk '{print $1}')" = "311b85839c81b8921b365012b467d4a3d36fd4a06c60d2e815067022d3049a5d"
          test "$(sha256sum .scratch/e51ae/tnn_r32_e51ae_trajectory_critical_candidate_residual.zag | awk '{print $1}')" = "d3b0038776e31ff82148913534db6dee95954a19f784246b1bea5fd823e6aee0"

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler='Research/toolchain/znc_linux_x86_64_abed8aa1'
          src='.scratch/e51ae/tnn_r32_e51ae_trajectory_critical_candidate_residual.zag'
          chmod +x "$compiler"
          "$compiler" "$src" -o .scratch/e51ae/NATIVE_BUILD_1 > .scratch/e51ae/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$compiler" "$src" -o .scratch/e51ae/NATIVE_BUILD_2 > .scratch/e51ae/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51ae/NATIVE_BUILD_1 .scratch/e51ae/NATIVE_BUILD_2 | tee .scratch/e51ae/BINARY_SHA256SUMS.txt
          cmp .scratch/e51ae/NATIVE_BUILD_1 .scratch/e51ae/NATIVE_BUILD_2
          test "$(sha256sum .scratch/e51ae/NATIVE_BUILD_1 | awk '{print $1}')" = "8438b72416bdbf0121f39e1f4086393df7edced90287914b6439673fe5d18f2b"
          echo 1 > .scratch/e51ae/BYTE_IDENTICAL.txt

      - name: Execute E51AE native discriminator
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 16000 .scratch/e51ae/NATIVE_BUILD_1 > .scratch/e51ae/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          echo "$code" > .scratch/e51ae/EXIT_CODE.txt
          echo "$((end-start))" > .scratch/e51ae/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|e51y_parent_e50_integrity_gate|e51y_terminal_reproduction|R32_E51AE_NATIVE|experiment_schema,tnn_r32_e51ae|claim_boundary,native_candidate|native_zag|mature_slot|frozen_direct|residual_|candidate_action|evaluator_|ambiguity_|unknown_|topology_|graph_|e51ae_|TNN_R32_E51AE_)' .scratch/e51ae/RAW.log > .scratch/e51ae/SUMMARY.log || true
          cat .scratch/e51ae/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51AE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51ae-native-${{ github.sha }}
          path: |
            .scratch/e51ae/
            Research/R32_E51AE_TRAJECTORY_CRITICAL_CANDIDATE_RESIDUAL_PREREG.md
            Research/R32_E51AE_NATIVE/
            Research/R32_E51AD_RESULT.md
            Research/R32_E51AD_TRAJECTORY_CRITICAL_ROUTER_PREREG.md
            Research/R32_E51AC_RESULT.md
            Research/R32_E51AB_RESULT.md
            .github/scripts/e51x_assemble.py
            .github/scripts/e51y_assemble.py
            .github/scripts/e51ad_assemble.py
            .github/scripts/e51ae_assemble.py
          compression-level: 6
          if-no-files-found: error
