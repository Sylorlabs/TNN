name: R32 E51F Exact State Aliasing Audit

on:
  push:
    branches: [r32-agent-sequential-frontier]
    paths:
      - 'Research/R32_E51F_NATIVE/**'
      - 'Research/R32_E51F_STATE_ALIASING_AUDIT_PREREG.md'
      - '.github/workflows/r32-e51f-native.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble native audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51f
          cp Research/tnn_r32_e45_investigation_core.zag .scratch/e51f/tnn_r32_e45_investigation_core.zag
          cat Research/R32_E51F_NATIVE/01_exact_aliasing_audit.zagfrag > .scratch/e51f/E51F_FRAGMENT.zag
          python3 - <<'PY'
          from pathlib import Path
          src = Path('Research/tnn_r32_e50_provenance_temporal_contention_discriminator.zag').read_text()
          frag = Path('.scratch/e51f/E51F_FRAGMENT.zag').read_text()
          injection = Path('Research/R32_E51F_NATIVE/02_main_injection.zagfrag').read_text()
          marker = 'fn main()i32 {'
          assert src.count(marker) == 1, src.count(marker)
          src = src.replace(marker, frag + '\n\n' + marker, 1)
          anchor = 'let aux_frozen_gate:i32=0; if(aux_frozen_hash==frozen_aux_hash){ aux_frozen_gate=1; } e45_print_pair("e50_aux_frozen_gate",aux_frozen_gate);'
          assert src.count(anchor) == 1, src.count(anchor)
          src = src.replace(anchor, anchor + '\n' + injection, 1)
          Path('.scratch/e51f/tnn_r32_e51f_state_aliasing_audit.zag').write_text(src)
          PY
          sha256sum .scratch/e51f/E51F_FRAGMENT.zag \
                    Research/R32_E51F_NATIVE/02_main_injection.zagfrag \
                    .scratch/e51f/tnn_r32_e51f_state_aliasing_audit.zag \
                    .scratch/e51f/tnn_r32_e45_investigation_core.zag \
                    | tee .scratch/e51f/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler='Research/toolchain/znc_linux_x86_64_abed8aa1'
          src='.scratch/e51f/tnn_r32_e51f_state_aliasing_audit.zag'
          chmod +x "$compiler"
          "$compiler" "$src" -o .scratch/e51f/NATIVE_BUILD_1 > .scratch/e51f/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$compiler" "$src" -o .scratch/e51f/NATIVE_BUILD_2 > .scratch/e51f/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51f/NATIVE_BUILD_1 .scratch/e51f/NATIVE_BUILD_2 | tee .scratch/e51f/BINARY_SHA256SUMS.txt
          cmp .scratch/e51f/NATIVE_BUILD_1 .scratch/e51f/NATIVE_BUILD_2
          echo 1 > .scratch/e51f/BYTE_IDENTICAL.txt

      - name: Execute E51F native audit
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 6000 .scratch/e51f/NATIVE_BUILD_1 > .scratch/e51f/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          printf '%s\n' "$code" > .scratch/e51f/EXIT_CODE.txt
          printf '%s\n' "$((end-start))" > .scratch/e51f/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|R32_E51F_NATIVE|experiment_schema,tnn_r32_e51f|epistemic_isolation|evaluator_truth_policy_input|hash_defines_identity|exact_feature_equality_defines_identity|topology_changed|graph_privileged|e51f_)' .scratch/e51f/RAW.log > .scratch/e51f/SUMMARY.log || true
          cat .scratch/e51f/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51F evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51f-native-${{ github.sha }}
          path: |
            .scratch/e51f/
            Research/R32_E51F_STATE_ALIASING_AUDIT_PREREG.md
            Research/R32_E51F_NATIVE/
          compression-level: 6
          if-no-files-found: error
