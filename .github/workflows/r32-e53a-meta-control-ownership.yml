name: R32 E53A Meta-Control Ownership

on:
  push:
    branches:
      - r32-e52-joint-action-value-frontier
    paths:
      - 'Research/R32_E53A_META_CONTROL_OWNERSHIP_PREREG.md'
      - 'Research/R32_OWNERSHIP_BOUNDARY_AUDIT.md'
      - 'Research/tnn_r32_e53a_meta_control_ownership.zag'
      - 'Research/tnn_r32_e53_conservative_policy_core.zag'
      - '.github/workflows/r32-e53a-meta-control-ownership.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Research/R32_E53A_META_CONTROL_OWNERSHIP_PREREG.md'
      - 'Research/R32_OWNERSHIP_BOUNDARY_AUDIT.md'
      - 'Research/tnn_r32_e53a_meta_control_ownership.zag'
      - 'Research/tnn_r32_e53_conservative_policy_core.zag'
      - '.github/workflows/r32-e53a-meta-control-ownership.yml'

permissions:
  contents: read

jobs:
  audit:
    name: E53A native ownership pressure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Freeze evidence and ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          out='.scratch/e53a'
          mkdir -p "$out"
          sha256sum Research/R32_E53A_META_CONTROL_OWNERSHIP_PREREG.md | tee "$out/PREREG_SHA256.txt"
          sha256sum Research/R32_OWNERSHIP_BOUNDARY_AUDIT.md | tee "$out/OWNERSHIP_AUDIT_SHA256.txt"
          sha256sum Research/tnn_r32_e53a_meta_control_ownership.zag | tee "$out/SOURCE_SHA256.txt"
          sha256sum Research/tnn_r32_e53_conservative_policy_core.zag | tee "$out/PARENT_E53_CORE_SHA256.txt"
          test "$(grep -cF 'fn e53a_choose(qvalues:[]i32,context:i32)i32 {' Research/tnn_r32_e53a_meta_control_ownership.zag)" -eq 1
          test "$(grep -cF 'fn e53a_context(policy_value:i32,replay_anchor:i32)i32 {' Research/tnn_r32_e53a_meta_control_ownership.zag)" -eq 1
          test "$(grep -cF 'const R32E53_UNKNOWN_VALUE:i32=0;' Research/tnn_r32_e53_conservative_policy_core.zag)" -eq 1
          test "$(grep -cF 'const E53A_UNKNOWN_VALUE:i32=0;' Research/tnn_r32_e53a_meta_control_ownership.zag)" -eq 1
          printf 'selector_inputs=qvalues,context\ncontext_inputs=policy_value,replay_anchor\n' > "$out/SELECTOR_CONTRACT.txt"

      - name: Compile twice with persisted official Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          src='Research/tnn_r32_e53a_meta_control_ownership.zag'
          out='.scratch/e53a'
          compiler='Research/toolchain/znc_linux_x86_64_abed8aa1'
          chmod +x "$compiler"
          "$compiler" "$src" -o "$out/NATIVE_BUILD_1" > "$out/NATIVE_BUILD_1_COMPILE.log" 2>&1
          "$compiler" "$src" -o "$out/NATIVE_BUILD_2" > "$out/NATIVE_BUILD_2_COMPILE.log" 2>&1
          sha256sum "$out/NATIVE_BUILD_1" "$out/NATIVE_BUILD_2" | tee "$out/BINARY_SHA256.txt"
          cmp "$out/NATIVE_BUILD_1" "$out/NATIVE_BUILD_2"
          echo 1 > "$out/BYTE_IDENTICAL.txt"

      - name: Execute native ownership pressure test
        shell: bash
        run: |
          set -euo pipefail
          out='.scratch/e53a'
          set +e
          "$out/NATIVE_BUILD_1" > "$out/RAW.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$out/EXIT_CODE.txt"
          cat "$out/RAW.log"
          test "$code" -eq 0
          grep -qF 'TNN_R32_E53A_META_CONTROL_OWNERSHIP_GATE=PASS' "$out/RAW.log"
          grep -E '^(meta_selected|balanced_development_gate|selected_distinct_meta_actions|adaptive_action_diversity|adaptive_action_switches|adaptive_validation_objective|best_fixed_validation_objective|adaptive_superiority_gate|validation_context_balance_gate|unknown_value_zero_gate|evaluator_family_inside_selector|graph_substrate_required|candidate_vocabulary_still_protected|TNN_R32_E53A_META_CONTROL_OWNERSHIP_GATE)' "$out/RAW.log" > "$out/SUMMARY.txt"
          cat "$out/SUMMARY.txt"

      - name: Preserve native evidence
        uses: actions/upload-artifact@v4
        with:
          name: r32-e53a-meta-control-ownership-${{ github.sha }}
          path: |
            .scratch/e53a/
            Research/R32_E53A_META_CONTROL_OWNERSHIP_PREREG.md
            Research/R32_OWNERSHIP_BOUNDARY_AUDIT.md
            Research/tnn_r32_e53a_meta_control_ownership.zag
          if-no-files-found: error
          compression-level: 6
