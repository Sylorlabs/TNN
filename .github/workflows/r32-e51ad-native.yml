name: R32 E51AD Trajectory-Critical Router

on:
  push:
    branches:
      - r32-agent-sequential-frontier
    paths:
      - 'Research/R32_E51AD_TRAJECTORY_CRITICAL_ROUTER_PREREG.md'
      - 'Research/R32_E51AD_NATIVE/**'
      - '.github/scripts/e51ad_assemble.py'
      - '.github/workflows/r32-e51ad-native.yml'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout full project
        uses: actions/checkout@v4

      - name: Assemble frozen E51X lineage plus E51AD router
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/e51ad
          python3 .github/scripts/e51x_assemble.py
          python3 .github/scripts/e51y_assemble.py
          python3 .github/scripts/e51ad_assemble.py
          sha256sum \
            Research/R32_E51AD_TRAJECTORY_CRITICAL_ROUTER_PREREG.md \
            Research/R32_E51AD_NATIVE/01a_contract_support.zagfrag \
            Research/R32_E51AD_NATIVE/01b_critical_fit.zagfrag \
            Research/R32_E51AD_NATIVE/01c_policy_eval.zagfrag \
            Research/R32_E51AD_NATIVE/02a_direct_reconstruction.zagfrag \
            Research/R32_E51AD_NATIVE/02b_router_training.zagfrag \
            Research/R32_E51AD_NATIVE/02c_validation_outcome.zagfrag \
            Research/R32_E51AD_NATIVE/03_main_injection.zagfrag \
            .github/scripts/e51ad_assemble.py \
            .scratch/e51ad/E51AD_FRAGMENT.zag \
            .scratch/e51ad/tnn_r32_e51ad_trajectory_critical_router.zag \
            .scratch/e51ad/tnn_r32_e45_investigation_core.zag \
            | tee .scratch/e51ad/SOURCE_SHA256SUMS.txt

      - name: Compile twice with persisted official native Zag compiler
        shell: bash
        run: |
          set -euo pipefail
          c=Research/toolchain/znc_linux_x86_64_abed8aa1
          s=.scratch/e51ad/tnn_r32_e51ad_trajectory_critical_router.zag
          chmod +x "$c"
          "$c" "$s" -o .scratch/e51ad/NATIVE_BUILD_1 > .scratch/e51ad/NATIVE_BUILD_1_COMPILE.log 2>&1
          "$c" "$s" -o .scratch/e51ad/NATIVE_BUILD_2 > .scratch/e51ad/NATIVE_BUILD_2_COMPILE.log 2>&1
          sha256sum .scratch/e51ad/NATIVE_BUILD_1 .scratch/e51ad/NATIVE_BUILD_2 | tee .scratch/e51ad/BINARY_SHA256SUMS.txt
          cmp .scratch/e51ad/NATIVE_BUILD_1 .scratch/e51ad/NATIVE_BUILD_2
          echo 1 > .scratch/e51ad/BYTE_IDENTICAL.txt

      - name: Execute E51AD native discriminator
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          set +e
          timeout 17000 .scratch/e51ad/NATIVE_BUILD_1 > .scratch/e51ad/RAW.log 2>&1
          code=$?
          set -e
          end=$(date +%s)
          echo "$code" > .scratch/e51ad/EXIT_CODE.txt
          echo "$((end-start))" > .scratch/e51ad/RUNTIME_SECONDS.txt
          grep -E '^(e50_seed_preflight_gate|e50_batch_statistics_gate|e50_batch_forward_reverse_identity_gate|e50_batch_convergence_gate|e50_aux_frozen_gate|e51y_parent_e50_integrity_gate|e51y_terminal_reproduction|R32_E51AD_NATIVE|experiment_schema,tnn_r32_e51ad|claim_boundary,native_fixed|native_zag|mature_slot|direct_candidate|gate_|evaluator_|ambiguity_|mode_resource|unknown_|topology_|graph_|e51ad_|TNN_R32_E51AD_)' .scratch/e51ad/RAW.log > .scratch/e51ad/SUMMARY.log || true
          cat .scratch/e51ad/SUMMARY.log
          echo "native_exit_code=$code"
          test "$code" -eq 0

      - name: Preserve complete E51AD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r32-e51ad-native-${{ github.sha }}
          path: |
            .scratch/e51ad/
            Research/R32_E51AD_TRAJECTORY_CRITICAL_ROUTER_PREREG.md
            Research/R32_E51AD_NATIVE/
            Research/R32_E51AC_RESULT.md
            Research/R32_E51AC_ADDITIVE_DIRECT_CANDIDATE_HYBRID_PREREG.md
            Research/R32_E51AB_RESULT.md
            Research/R32_E51AB_DIRECT_CANDIDATE_COMMIT_PREREG.md
            Research/R32_E51Y_RESULT.md
            .github/scripts/e51x_assemble.py
            .github/scripts/e51y_assemble.py
            .github/scripts/e51ad_assemble.py
          compression-level: 6
          if-no-files-found: error
